  <script>
    // --- LOGIKA PWA INSTALL PROMPT ---
    let deferredPrompt;
    const installBtn = document.getElementById('btn-install');
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
      installBtn.classList.add('inline-flex');
    });
    
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.classList.add('hidden');
        }
        deferredPrompt = null;
      } else if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        alert('Untuk memasang di iPhone/iPad: Tekan ikon "Share" di bilah bawah Safari, lalu pilih "Add to Home Screen" (Tambahkan ke Layar Utama).');
      }
    });
    
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.navigator.standalone) {
      installBtn.classList.remove('hidden');
      installBtn.classList.add('inline-flex');
    }
    
    window.addEventListener('appinstalled', () => {
      installBtn.classList.add('hidden');
    });
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('Gagal mendaftarkan service worker:', err);
        });
      });
    }

    let i18nDictionary = {};
    let SPKLU_NETWORK = [];
    let HIGHWAY_GRAPH = {};
    let CITIES = [];
    let currentLang = localStorage.getItem('lang') || 'id';

    let selectedSegmentFilter = null;
    let selectedSpeedFilter = 'all';
    let selectedConnectors = new Set(['CCS2', 'Chademo', 'AC']);

    function animatedRouting(resetSegment = false) {
      if (resetSegment) selectedSegmentFilter = null;

      if (document.startViewTransition) {
        document.startViewTransition(() => {
          runRouting();
        });
      } else {
        runRouting();
      }
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      setTheme(isDark ? 'light' : 'dark');
    }

    function setTheme(theme) {
      const darkIcon = document.getElementById('theme-icon-dark');
      const lightIcon = document.getElementById('theme-icon-light');

      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        darkIcon.classList.remove('hidden');
        lightIcon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
      localStorage.setItem('theme', theme);
    }

    function t(key) {
      if (!i18nDictionary[currentLang]) return key;
      return i18nDictionary[currentLang][key] || key;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.title = t('seo_title');
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', t('seo_desc'));

      document.getElementById('btn-id').className = `px-2 py-0.5 font-bold rounded transition-all ${lang === 'id' ? 'bg-white dark:bg-slate-800 text-slate-950 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`;
      document.getElementById('btn-en').className = `px-2 py-0.5 font-bold rounded transition-all ${lang === 'en' ? 'bg-white dark:bg-slate-800 text-slate-950 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'OPTION') {
          el.textContent = t(key);
        } else if (el.tagName === 'INPUT' && el.type === 'text') {
          el.placeholder = t(key);
        } else if (el.hasAttribute('title')) {
          el.title = t(key);
        } else {
          el.textContent = t(key);
        }
      });

      const kmInput = document.getElementById("current-km");
      if (kmInput) kmInput.placeholder = t('km_ph');
      const batteryInput = document.getElementById("battery-range");
      if (batteryInput) batteryInput.placeholder = t('battery_ph');

      animatedRouting(false);
    }

    function populateDropdowns(cities) {
      const originEl = document.getElementById("origin");
      const destEl = document.getElementById("destination");
      const optionsMarkup = cities.map(city => `<option value="${city.id}">${city.name}</option>`).join("");
      originEl.innerHTML = optionsMarkup;
      destEl.innerHTML = optionsMarkup;
      originEl.value = "jakarta";
      destEl.value = "surabaya";
    }

    function swapLocations() {
      const swapBtn = document.getElementById("btn-swap");
      swapBtn.classList.toggle("swap-active");

      const originEl = document.getElementById("origin");
      const destEl = document.getElementById("destination");
      const temp = originEl.value;
      originEl.value = destEl.value;
      destEl.value = temp;

      animatedRouting(true);
    }

    function clearKm() {
      document.getElementById("current-km").value = "";
      animatedRouting(false);
    }

    function toggleSegmentFilter(segKey) {
      selectedSegmentFilter = (selectedSegmentFilter === segKey) ? null : segKey;
      animatedRouting(false);
    }

    function setSpeedFilter(minPower) {
      selectedSpeedFilter = minPower;

      ['all', '50', '100', '200'].forEach(val => {
        const btn = document.getElementById(`btn-speed-${val}`);
        if (val === minPower) {
          btn.className = "px-2 py-1 rounded-md text-[11px] font-semibold transition-all bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm";
        } else {
          btn.className = "px-2 py-1 rounded-md text-[11px] font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
        }
      });

      animatedRouting(false);
    }

    function toggleConnector(type) {
      if (selectedConnectors.has(type)) {
        if (selectedConnectors.size > 1) {
          selectedConnectors.delete(type);
        }
      } else {
        selectedConnectors.add(type);
      }

      ['CCS2', 'Chademo', 'AC'].forEach(tp => {
        const btn = document.getElementById(`btn-conn-${tp.toLowerCase()}`);
        if (selectedConnectors.has(tp)) {
          btn.className = "px-2 py-1 rounded-md text-[11px] font-bold transition-all bg-emerald-600 text-white shadow-sm dark:bg-emerald-500 dark:text-slate-950 active:scale-95";
        } else {
          btn.className = "px-2 py-1 rounded-md text-[11px] font-bold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white active:scale-95";
        }
      });

      animatedRouting(false);
    }

    function formatSegment(segment, side) {
      const parts = segment.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1));
      if (side === 'B') {
        return `${parts[1]} → ${parts[0]}`;
      }
      return `${parts[0]} → ${parts[1]}`;
    }

    function findRoute(start, end) {
      if (start === end) return null;
      let queue = [[start, []]];
      let visited = new Set([start]);

      while (queue.length > 0) {
        let [current, path] = queue.shift();
        if (current === end) return path;

        const neighbors = HIGHWAY_GRAPH[current] || [];
        for (let edge of neighbors) {
          if (!visited.has(edge.to)) {
            visited.add(edge.to);
            queue.push([edge.to, [...path, edge]]);
          }
        }
      }
      return null;
    }

    function getBrandDot(brand) {
      const b = (brand || '').toUpperCase();
      if (b.includes('WULING')) return 'bg-red-500';
      if (b.includes('ASTRA')) return 'bg-blue-500';
      if (b.includes('IGREEN')) return 'bg-teal-500';
      return 'bg-emerald-600 dark:bg-emerald-400';
    }

    function runRouting() {
      if (SPKLU_NETWORK.length === 0 || Object.keys(HIGHWAY_GRAPH).length === 0) return;

      const origin = document.getElementById("origin").value;
      const destination = document.getElementById("destination").value;
      const currentKmVal = document.getElementById("current-km").value.trim();
      const hasCurrentKm = currentKmVal !== "" && !isNaN(parseFloat(currentKmVal));
      const curKm = hasCurrentKm ? parseFloat(currentKmVal) : null;

      const batteryRangeVal = document.getElementById("battery-range").value.trim();
      const hasBatteryRange = batteryRangeVal !== "" && !isNaN(parseFloat(batteryRangeVal));
      const batteryRange = hasBatteryRange ? parseFloat(batteryRangeVal) : null;
      const filterWithinRange = document.getElementById("filter-within-range").checked;

      const resultsContainer = document.getElementById("results-list");
      const corridorSummary = document.getElementById("corridor-summary");
      const matchCounter = document.getElementById("match-counter");

      if (origin === destination) {
        corridorSummary.innerHTML = "";
        matchCounter.textContent = `0 ${t('spots_ahead')}`;
        resultsContainer.innerHTML = `
          <div class="text-center py-8 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl bg-white/60 dark:bg-slate-900/10 animate-ios-card">
            <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm font-medium">${t('err_same_city')}</p>
          </div>
        `;
        return;
      }

      const legs = findRoute(origin, destination);
      if (!legs) {
        resultsContainer.innerHTML = `
          <div class="p-5 text-center text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800 rounded-2xl bg-white/60 dark:bg-slate-900/20 animate-ios-card text-xs sm:text-sm">
            ${t('err_no_route')}
          </div>
        `;
        return;
      }

      // Single-line Horizontal Scroll Segment Chips
      let chipsMarkup = `
        <button type="button" onclick="selectedSegmentFilter = null; animatedRouting(false)" class="whitespace-nowrap shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition-all duration-200 ${selectedSegmentFilter === null ? 'bg-slate-900 text-white dark:bg-slate-700 shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-950/70 dark:text-slate-400 dark:border-slate-800'} active:scale-95">
          ${t('all_segments')}
        </button>
      `;

      chipsMarkup += legs.map(leg => {
        const isSelected = selectedSegmentFilter === leg.segment;
        return `
          <button type="button" onclick="toggleSegmentFilter('${leg.segment}')" class="whitespace-nowrap shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-mono transition-all duration-200 ${isSelected ? 'bg-emerald-600 text-white dark:bg-emerald-500 dark:text-slate-950 font-bold shadow-sm' : 'bg-white text-slate-700 border border-slate-200/90 hover:bg-slate-50 dark:bg-slate-950/70 dark:border-slate-800 dark:text-slate-300'} active:scale-95">
            <span class="w-4 h-4 rounded text-[10px] font-black flex items-center justify-center ${isSelected ? 'bg-white/20 text-white dark:bg-slate-950/20 dark:text-slate-950' : 'bg-emerald-50 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400'}">${leg.side}</span>
            <span>${formatSegment(leg.segment, leg.side)}</span>
          </button>
        `;
      }).join("");

      corridorSummary.innerHTML = chipsMarkup;

      let matchedStations = [];
      legs.forEach(leg => {
        let stationsOnLeg = SPKLU_NETWORK.filter(s => s.segment === leg.segment && s.side === leg.side);
        stationsOnLeg.sort((a, b) => leg.order === 'asc' ? a.km - b.km : b.km - a.km);
        stationsOnLeg.forEach(s => {
          matchedStations.push({ ...s, legOrder: leg.order });
        });
      });

      if (selectedSegmentFilter) {
        matchedStations = matchedStations.filter(s => s.segment === selectedSegmentFilter);
      }

      if (selectedConnectors.size > 0 && selectedConnectors.size < 3) {
        matchedStations = matchedStations.filter(s => 
          (s.types || []).some(tp => selectedConnectors.has(tp))
        );
      }

      let passedCount = 0;
      if (hasCurrentKm) {
        const totalBefore = matchedStations.length;
        matchedStations = matchedStations.filter(s => {
          if (s.legOrder === 'asc') {
            return s.km >= curKm;
          } else {
            return s.km <= curKm;
          }
        });
        passedCount = totalBefore - matchedStations.length;
      }

      if (selectedSpeedFilter !== 'all') {
        const minKW = parseInt(selectedSpeedFilter, 10);
        matchedStations = matchedStations.filter(s => s.highest_power >= minKW);
      }

      matchedStations = matchedStations.map((s, idx, arr) => {
        let distAhead = null;
        let distFromPrev = null;

        if (hasCurrentKm) {
          distAhead = s.legOrder === 'asc' ? (s.km - curKm) : (curKm - s.km);
          if (distAhead < 0) distAhead = 0;
        }

        distFromPrev = idx === 0 ? 0 : Math.abs(s.km - arr[idx - 1].km);
        const isWithinBattery = hasBatteryRange && distAhead !== null ? (distAhead <= batteryRange) : null;

        return {
          ...s,
          distAhead,
          distFromPrev,
          isWithinBattery
        };
      });

      if (filterWithinRange && hasBatteryRange && hasCurrentKm) {
        matchedStations = matchedStations.filter(s => s.isWithinBattery);
      }

      const ultraCount = matchedStations.filter(s => s.highest_power >= 200).length;
      let counterText = `${matchedStations.length} ${t('spots_ahead')} (${ultraCount} ${t('speed_ultra')} 200 kW)`;
      if (passedCount > 0) {
        counterText += ` • <span class="text-amber-600 dark:text-amber-400 font-normal">${passedCount} ${t('past_hidden')}</span>`;
      }
      matchCounter.innerHTML = counterText;

      if (matchedStations.length === 0) {
        resultsContainer.innerHTML = `
          <div class="text-center py-8 border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/30 rounded-2xl animate-ios-card">
            <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm font-medium">${t('err_no_match')}</p>
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = matchedStations.map((s, idx) => {
        let powerLabel = t('speed_fast');
        if (s.highest_power >= 200) powerLabel = t('speed_ultra');
        else if (s.highest_power >= 100) powerLabel = t('speed_rapid');

        // Total Kapasitas
        const totalMachines = (s.chargers || []).length;
        const totalPorts = (s.chargers || []).reduce((acc, c) => acc + (c.total_ports || (c.ports ? c.ports.length : 1)), 0);

        let capacityBadge = '';
        if (totalPorts >= 6 || totalMachines >= 3) {
          capacityBadge = `
            <span class="inline-flex items-center gap-1 font-mono text-[10px] sm:text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-800 dark:text-emerald-300 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 dark:bg-emerald-400 animate-pulse"></span>
              ⚡ ${totalMachines} ${t('label_chargers')} • ${totalPorts} ${t('label_plugs')} (${t('hub_large')})
            </span>
          `;
        } else if (totalPorts >= 3 || totalMachines === 2) {
          capacityBadge = `
            <span class="inline-flex items-center gap-1 font-mono text-[10px] sm:text-[11px] font-semibold px-2 py-0.5 rounded-md bg-sky-500/10 text-sky-800 dark:text-sky-300 border border-sky-500/20">
              ⚡ ${totalMachines} ${t('label_chargers')} • ${totalPorts} ${t('label_plugs')}
            </span>
          `;
        } else {
          capacityBadge = `
            <span class="inline-flex items-center gap-1 font-mono text-[10px] sm:text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700/60">
              ${totalMachines} ${t('label_chargers')} • ${totalPorts} ${t('label_plugs')} (${t('hub_small')})
            </span>
          `;
        }

        // Distance Badge
        let distanceBadge = '';
        if (hasCurrentKm && s.distAhead !== null) {
          distanceBadge = `
            <span class="inline-flex items-center font-mono font-bold text-xs px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20">
              📍 ${s.distAhead} ${t('km_ahead')}
            </span>
          `;
        } else {
          distanceBadge = idx === 0 
            ? `<span class="inline-flex items-center font-mono text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200/80 dark:border-slate-700/60">${t('first_stop')}</span>`
            : `<span class="inline-flex items-center font-mono text-[11px] px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700/60">🚗 +${s.distFromPrev} ${t('from_prev_stop')}</span>`;
        }

        let batteryBadge = '';
        if (hasBatteryRange && hasCurrentKm) {
          batteryBadge = s.isWithinBattery
            ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20">✓ ${t('within_battery')}</span>`
            : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-500/10 dark:text-rose-400 dark:border-rose-500/20">⚠️ ${t('outside_battery')}</span>`;
        }

        // Kelompokkan Mesin Seragam (2× PLN | 2× CCS2 180 kW)
        const dispenserGroupMap = {};
        (s.chargers || []).forEach(c => {
          const portCountMap = {};
          (c.ports || []).forEach(p => {
            const key = `${p.type} ${p.power}`;
            portCountMap[key] = (portCountMap[key] || 0) + 1;
          });

          const portSummaries = Object.entries(portCountMap).map(([desc, count]) => {
            return count > 1 ? `${count}× ${desc}` : desc;
          }).join(" • ");

          const signature = `${c.brand}___${portSummaries}`;
          if (!dispenserGroupMap[signature]) {
            dispenserGroupMap[signature] = {
              brand: c.brand,
              portSummaries: portSummaries,
              count: 0
            };
          }
          dispenserGroupMap[signature].count += 1;
        });

        const dispenserList = Object.values(dispenserGroupMap).map(item => {
          const machineCountPrefix = item.count > 1 ? `<span class="font-extrabold text-emerald-700 dark:text-emerald-400 mr-0.5">${item.count}×</span>` : '';
          return `
            <div class="inline-flex items-center gap-1.5 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800/80 rounded-lg px-2.5 py-1 text-xs">
              <span class="w-1.5 h-1.5 rounded-full ${getBrandDot(item.brand)} shrink-0"></span>
              <span class="font-semibold text-slate-700 dark:text-slate-300 text-[11px]">${machineCountPrefix}${item.brand}</span>
              <span class="text-slate-300 dark:text-slate-700 text-[10px]">|</span>
              <span class="font-mono text-slate-800 dark:text-slate-200 text-[11px] font-medium">${item.portSummaries}</span>
            </div>
          `;
        }).join("");

        const staggerDelay = Math.min(idx * 28, 250);

        return `
        <article style="animation-delay: ${staggerDelay}ms" class="animate-ios-card group bg-white/95 dark:bg-slate-900/40 hover:bg-slate-50/70 dark:hover:bg-slate-900/80 border border-slate-200/90 dark:border-slate-800/80 hover:border-slate-300 dark:hover:border-slate-700 rounded-2xl p-3 sm:p-3.5 transition-all duration-200 shadow-sm hover:shadow-md">
          
          <!-- Baris 1: Info KM, Jalur, Jarak, & Daya -->
          <div class="flex items-center justify-between gap-1.5 pb-2 border-b border-slate-100 dark:border-slate-800/60">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-mono text-xs font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20">
                KM ${s.km}
              </span>
              <span class="text-[11px] font-bold px-1.5 py-0.5 rounded-md ${s.side === 'A' ? 'bg-sky-50 text-sky-700 border border-sky-200 dark:bg-sky-500/10 dark:text-sky-400 dark:border-sky-500/20' : 'bg-purple-50 text-purple-700 border border-purple-200 dark:bg-purple-500/10 dark:text-purple-400 dark:border-purple-500/20'}">
                ${s.side}
              </span>
              ${capacityBadge}
              ${distanceBadge}
              ${batteryBadge}
            </div>

            <!-- Daya Terbesar -->
            <div class="text-right shrink-0">
              <span class="font-mono font-bold text-sm sm:text-base text-slate-900 dark:text-white">
                ${s.lowest_power !== s.highest_power ? `${s.lowest_power}~${s.highest_power}` : s.highest_power}<span class="text-xs font-sans font-semibold text-slate-400 ml-0.5">kW</span>
              </span>
              <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 ml-1 hidden sm:inline">${powerLabel}</span>
            </div>
          </div>

          <!-- Baris 2: Nama Rest Area & Tombol Navigasi Kontras -->
          <div class="mt-2 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h2 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base leading-tight group-hover:text-emerald-700 dark:group-hover:text-emerald-300 transition-colors">
                ${s.name}
              </h2>
              <span class="text-[11px] text-slate-400 dark:text-slate-500 font-medium">
                ${formatSegment(s.segment, s.side)}
              </span>
            </div>

            <!-- Tombol Navigasi Kontras -->
            <div class="flex items-center gap-1.5 shrink-0 self-end sm:self-center">
              <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener" 
                 class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-sm shadow-emerald-600/20 active:scale-95 transition-all">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>${t('btn_maps')}</span>
              </a>
              <a href="https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes" target="_blank" rel="noopener" 
                 class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs shadow-sm shadow-sky-600/20 active:scale-95 transition-all">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M20.5 12c0-4.69-3.81-8.5-8.5-8.5S3.5 7.31 3.5 12c0 2.21.84 4.22 2.22 5.73l-1.16 3.48c-.14.42.24.83.67.72l3.65-.91c1.37.63 2.91.98 4.54.98 4.69 0 8.5-3.81 8.5-8.5zm-11 1.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>${t('btn_waze')}</span>
              </a>
            </div>
          </div>

          <!-- Baris 3: Daftar Mesin Terkelompok Rapi -->
          <div class="mt-2 flex flex-wrap gap-1.5">
            ${dispenserList}
          </div>
        </article>
      `;
      }).join("");
    }

    // Inisialisasi Event Scroll Horizontal & Drag pada Ruas di Desktop
    function setupCorridorDesktopScroll() {
      const el = document.getElementById("corridor-summary");
      if (!el) return;

      // 1. Wheel Scroll to Horizontal
      el.addEventListener("wheel", (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          el.scrollLeft += e.deltaY * 0.9;
        }
      }, { passive: false });

      // 2. Click & Drag Scroll
      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;

      el.addEventListener("mousedown", (e) => {
        isDown = true;
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
      });

      el.addEventListener("mouseleave", () => { isDown = false; });
      el.addEventListener("mouseup", () => { isDown = false; });

      el.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - el.offsetLeft;
        const walk = (x - startX) * 1.5;
        el.scrollLeft = scrollLeft - walk;
      });
    }

    async function initApp() {
      const list = document.getElementById("results-list");

      initTheme();
      setupCorridorDesktopScroll();

      try {
        const [langRes, stationsRes, graphRes, citiesRes] = await Promise.all([
          fetch("i18n.json"),
          fetch("stations.json"),
          fetch("highway.json"),
          fetch("cities.json")
        ]);

        if (!langRes.ok) throw new Error(`i18n.json error ${langRes.status}`);
        if (!stationsRes.ok) throw new Error(`stations.json error ${stationsRes.status}`);
        if (!graphRes.ok) throw new Error(`highway.json error ${graphRes.status}`);
        if (!citiesRes.ok) throw new Error(`cities.json error ${citiesRes.status}`);
        
        i18nDictionary = await langRes.json();
        SPKLU_NETWORK = await stationsRes.json();
        HIGHWAY_GRAPH = await graphRes.json();
        CITIES = await citiesRes.json();

        populateDropdowns(CITIES);
        setLang(currentLang);
        
      } catch (err) {
        console.error("Initialization Failed:", err);
        list.innerHTML = `
          <div class="p-6 text-center text-rose-500 border border-rose-200 dark:border-rose-800/40 rounded-2xl text-sm animate-ios-card">
            Gagal memuat data SPKLU. Pastikan semua file JSON berada di folder yang sama ya.
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
