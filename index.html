  <!-- Inline CSS Kritis (App Shell Skeleton) untuk skor FCP Instan -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
      background-color: #070b14; /* Default gelap */
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Overlay Halaman Loading Asli yang Cepat Dimuat */
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #070b14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Versi Light Mode Skeleton */
    html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
    html:not(.dark) #initial-loader { background-color: #f8fafc; }
    html:not(.dark) .spinner { border-color: #cbd5e1; border-top-color: #059669; }
    html:not(.dark) .loader-text { color: #475569; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e293b;
      border-top: 4px solid #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* Menyembunyikan konten utama hingga siap */
    #app-content { opacity: 0; transition: opacity 0.5s ease; }
    
    .font-mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; }
    @media (max-width: 640px) { select, input { font-size: 16px !important; } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .drag-scroll { cursor: grab; user-select: none; }
    .drag-scroll:active { cursor: grabbing; }

    @keyframes iosCardIn { 0% { opacity: 0; transform: translateY(6px) scale(0.99); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .animate-ios-card { animation: iosCardIn 0.25s cubic-bezier(0.32, 0.72, 0, 1) both; }
    .swap-active svg { transform: rotate(180deg); }
    #results-list { min-height: 50vh; }
  </style>

  <!-- Script Deteksi Tema Kilat (Mencegah Flashing) -->
  <script>
    const savedTheme = localStorage.getItem('theme');
    const isDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (!isDark) document.documentElement.classList.remove('dark');
  </script>

</head>
<body class="selection:bg-emerald-600 selection:text-white transition-colors duration-300">

  <!-- Halaman Loading Skeleton Cepat (FCP & LCP Instan) -->
  <div id="initial-loader">
    <div class="spinner"></div>
    <div class="loader-text">Memuat Data SPKLU...</div>
  </div>

  <!-- Wrapper Aplikasi Utama -->
  <div id="app-content" class="min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/90 dark:bg-[#070b14]/85 backdrop-blur-xl sticky top-0 z-40 transition-colors duration-300">
      <div class="max-w-4xl mx-auto px-3.5 py-2.5 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="h-7 w-7 rounded-xl bg-emerald-500/10 dark:bg-emerald-500/15 border border-emerald-500/30 dark:border-emerald-500/40 flex items-center justify-center text-emerald-800 dark:text-emerald-400 font-bold text-xs shadow-sm">
            ⚡
          </div>
          <h1 data-i18n="title" class="font-extrabold text-slate-900 dark:text-white text-sm sm:text-base tracking-tight m-0">SPKLU Trans Jawa</h1>
        </div>
        
        <div class="flex items-center gap-1.5">
          <!-- Tombol Install PWA -->
          <button type="button" id="btn-install" class="hidden items-center gap-1 px-3 py-1.5 min-h-[36px] text-xs font-bold rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white shadow-sm transition-all duration-200 active:scale-95">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 111.414-1.414L9 10.586V3a1 1 0 011-1zM3 14a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
            <span>Install</span>
          </button>

          <!-- Theme Toggle -->
          <button type="button" onclick="toggleTheme()" id="theme-btn" aria-label="Ganti mode gelap/terang" class="h-9 w-9 min-h-[36px] min-w-[36px] rounded-lg flex items-center justify-center border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white shadow-sm transition-all active:scale-90">
            <svg id="theme-icon-dark" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="theme-icon-light" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>

          <!-- Language Toggle -->
          <div class="flex items-center bg-slate-200 dark:bg-slate-800 rounded-lg p-0.5 border border-slate-300 dark:border-slate-700 min-h-[36px]">
            <button onclick="setLang('id')" id="btn-id" class="px-2.5 py-1 min-h-[32px] text-xs font-bold rounded transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">ID</button>
            <button onclick="setLang('en')" id="btn-en" class="px-2.5 py-1 min-h-[32px] text-xs font-bold rounded transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 py-3 w-full flex-grow">
      
      <!-- Planner Box -->
      <section aria-label="Filter dan Rute" class="relative z-30 bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 rounded-2xl p-3 shadow-sm dark:shadow-xl backdrop-blur-xl mb-3 transition-all">
        
        <!-- Unified Route Box -->
        <div class="relative z-30 flex items-center bg-slate-50 dark:bg-slate-950/70 border border-slate-200/90 dark:border-slate-800/90 rounded-xl p-2 sm:p-2.5">
          
          <!-- Indikator Jalur -->
          <div class="flex flex-col items-center justify-between self-stretch py-1.5 px-1 shrink-0">
            <span class="w-2.5 h-2.5 rounded-full border-2 border-emerald-700 dark:border-emerald-500 bg-emerald-100 dark:bg-emerald-950"></span>
            <span class="w-0.5 flex-1 my-0.5 bg-slate-300 dark:bg-slate-700"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-rose-600 dark:bg-rose-500"></span>
          </div>

          <!-- Kontainer Dropdown Asal & Tujuan -->
          <div class="flex-1 min-w-0 flex flex-col gap-1 pr-2">
            
            <!-- Origin Dropdown Searchable -->
            <div class="relative" id="dropdown-origin-wrapper">
              <button type="button" id="origin-trigger" onclick="toggleDropdown('origin')" aria-haspopup="listbox" class="w-full flex items-center justify-between text-left py-2 min-h-[44px] text-slate-900 dark:text-white text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded-md px-1 group">
                <span id="origin-label" class="truncate">Jakarta</span>
                <svg class="h-4 w-4 text-slate-500 group-hover:text-emerald-600 transition-transform duration-200" id="origin-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              <div id="origin-menu" class="hidden absolute left-0 top-full mt-2 w-64 sm:w-72 max-h-64 overflow-y-auto no-scrollbar z-50 bg-white/95 dark:bg-slate-900/95 border border-slate-300 dark:border-slate-700 rounded-2xl shadow-2xl backdrop-blur-xl p-2 animate-ios-card" role="listbox">
                <div class="sticky top-0 bg-white/95 dark:bg-slate-900/95 pb-1.5 mb-1 border-b border-slate-200 dark:border-slate-800 z-10">
                  <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl px-2.5 py-2 min-h-[40px] focus-within:ring-2 focus-within:ring-emerald-500">
                    <svg class="w-4 h-4 text-slate-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="origin-search" oninput="filterCities('origin')" aria-label="Cari kota asal" placeholder="Cari kota asal..." autocomplete="off" class="w-full bg-transparent text-slate-900 dark:text-white text-sm focus:outline-none placeholder-slate-500">
                  </div>
                </div>
                <div id="origin-list" class="space-y-0.5"></div>
              </div>
              <input type="hidden" id="origin" value="jakarta">
            </div>

            <div class="h-px bg-slate-200 dark:bg-slate-700 w-full"></div>

            <!-- Destination Dropdown Searchable -->
            <div class="relative" id="dropdown-destination-wrapper">
              <button type="button" id="destination-trigger" onclick="toggleDropdown('destination')" aria-haspopup="listbox" class="w-full flex items-center justify-between text-left py-2 min-h-[44px] text-slate-900 dark:text-white text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded-md px-1 group">
                <span id="destination-label" class="truncate">Surabaya</span>
                <svg class="h-4 w-4 text-slate-500 group-hover:text-emerald-600 transition-transform duration-200" id="destination-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              <div id="destination-menu" class="hidden absolute left-0 top-full mt-2 w-64 sm:w-72 max-h-64 overflow-y-auto no-scrollbar z-50 bg-white/95 dark:bg-slate-900/95 border border-slate-300 dark:border-slate-700 rounded-2xl shadow-2xl backdrop-blur-xl p-2 animate-ios-card" role="listbox">
                <div class="sticky top-0 bg-white/95 dark:bg-slate-900/95 pb-1.5 mb-1 border-b border-slate-200 dark:border-slate-800 z-10">
                  <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl px-2.5 py-2 min-h-[40px] focus-within:ring-2 focus-within:ring-emerald-500">
                    <svg class="w-4 h-4 text-slate-500 mr-2 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="destination-search" oninput="filterCities('destination')" aria-label="Cari kota tujuan" placeholder="Cari kota tujuan..." autocomplete="off" class="w-full bg-transparent text-slate-900 dark:text-white text-sm focus:outline-none placeholder-slate-500">
                  </div>
                </div>
                <div id="destination-list" class="space-y-0.5"></div>
              </div>
              <input type="hidden" id="destination" value="surabaya">
            </div>
          </div>

          <!-- Tombol Tukar Arah Rute -->
          <div class="shrink-0 pl-1">
            <button type="button" id="btn-swap" onclick="swapLocations()" aria-label="Tukar rute awal dan tujuan" data-i18n="swap_tooltip" title="Tukar arah rute" class="h-11 w-11 min-h-[44px] min-w-[44px] rounded-xl bg-white hover:bg-emerald-700 hover:text-white dark:bg-slate-800 dark:hover:bg-emerald-600 dark:hover:text-white text-slate-700 dark:text-emerald-400 border border-slate-300 dark:border-slate-600 transition-all duration-300 flex items-center justify-center shadow-sm active:scale-90">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Ruas Tol -->
        <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-800/80">
          <div id="corridor-summary" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 -mx-1 px-1 drag-scroll">
          </div>
        </div>

        <!-- Filter Controls -->
        <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-800/80 space-y-3">
          
          <!-- Baris Filter 1: Colokan & Kecepatan -->
          <div class="flex items-center justify-between gap-2 overflow-x-auto no-scrollbar pb-1">
            <!-- Colokan -->
            <div class="flex items-center gap-1 bg-slate-200/80 dark:bg-slate-900 p-1 border border-slate-300 dark:border-slate-700 rounded-lg shrink-0">
              <button type="button" onclick="toggleConnector('CCS2')" id="btn-conn-ccs2" aria-pressed="true" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all bg-emerald-700 text-white shadow-sm dark:bg-emerald-600 dark:text-white active:scale-95">CCS2</button>
              <button type="button" onclick="toggleConnector('Chademo')" id="btn-conn-chademo" aria-pressed="true" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all bg-emerald-700 text-white shadow-sm dark:bg-emerald-600 dark:text-white active:scale-95">Chademo</button>
              <button type="button" onclick="toggleConnector('AC')" id="btn-conn-ac" aria-pressed="true" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all bg-emerald-700 text-white shadow-sm dark:bg-emerald-600 dark:text-white active:scale-95">AC</button>
            </div>

            <!-- Kecepatan -->
            <div class="flex items-center gap-1 bg-slate-200/80 dark:bg-slate-900 p-1 border border-slate-300 dark:border-slate-700 rounded-lg shrink-0">
              <button type="button" onclick="setSpeedFilter('all')" id="btn-speed-all" aria-pressed="true" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm" data-i18n="speed_all">Semua</button>
              <button type="button" onclick="setSpeedFilter('50')" id="btn-speed-50" aria-pressed="false" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">≥50k</button>
              <button type="button" onclick="setSpeedFilter('100')" id="btn-speed-100" aria-pressed="false" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">≥100k</button>
              <button type="button" onclick="setSpeedFilter('200')" id="btn-speed-200" aria-pressed="false" class="px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">200k</button>
            </div>
          </div>

          <!-- Baris Filter 2: KM, Sisa Baterai -->
          <div class="flex items-center gap-2 text-xs">
            <div class="flex-1 flex items-center bg-white dark:bg-slate-950/80 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-2 min-h-[44px] focus-within:border-emerald-600 dark:focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all">
              <label for="current-km" class="sr-only">KM Sekarang</label>
              <span class="text-[11px] font-bold font-mono text-emerald-800 dark:text-emerald-400 mr-1.5 shrink-0">KM</span>
              <input type="number" id="current-km" oninput="animatedRouting(false)" placeholder="Cth. 57" class="w-full bg-transparent text-slate-900 dark:text-white placeholder-slate-500 text-sm focus:outline-none font-mono">
              <button type="button" onclick="clearKm()" aria-label="Hapus KM" class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white min-h-[32px] min-w-[32px] flex items-center justify-center -mr-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>

            <div class="flex-1 flex items-center bg-white dark:bg-slate-950/80 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-2 min-h-[44px] focus-within:border-emerald-600 dark:focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all">
              <label for="battery-range" class="sr-only">Jangkauan Baterai (km)</label>
              <span class="text-sm mr-1.5 shrink-0" aria-hidden="true">🔋</span>
              <input type="number" id="battery-range" oninput="animatedRouting(false)" placeholder="Cth. 150" class="w-full bg-transparent text-slate-900 dark:text-white placeholder-slate-500 text-sm focus:outline-none font-mono">
              <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400 font-mono shrink-0 ml-1">km</span>
            </div>

            <label class="shrink-0 flex items-center gap-1.5 cursor-pointer select-none bg-white dark:bg-slate-950/80 border border-slate-300 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-600 rounded-lg px-3 py-2 min-h-[44px] text-xs text-slate-800 dark:text-slate-200 font-bold shadow-sm transition-colors">
              <input type="checkbox" id="filter-within-range" onchange="animatedRouting(false)" class="rounded border-slate-400 dark:border-slate-600 text-emerald-600 focus:ring-emerald-500 cursor-pointer w-4 h-4">
              <span class="hidden sm:inline" data-i18n="within_range_only">Dalam jangkauan</span>
              <span class="sm:hidden">Aman</span>
            </label>
          </div>
        </div>
      </section>

      <!-- Status Bar -->
      <div id="stats-banner" class="flex items-center justify-between px-1 mb-3 text-xs text-slate-600 dark:text-slate-400 font-semibold" aria-live="polite">
        <span id="match-counter" data-i18n="loading">Mengecek tempat cas di sepanjang jalurmu...</span>
        <span data-i18n="sort_info" class="text-slate-500 dark:text-slate-500 text-[11px] hidden sm:block">Urut sesuai arah jalanmu</span>
      </div>

      <!-- SPKLU Cards Container -->
      <section aria-label="Daftar SPKLU" id="results-list" class="relative z-0 space-y-3">
        <div class="p-6 text-center text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800/60 rounded-2xl bg-white dark:bg-slate-900/20 shadow-sm" data-i18n="loading">
          Mengecek tempat cas di sepanjang jalurmu...
        </div>
      </section>

  <!-- Memindah Tailwind ke bawah agar tidak mengeblok halaman Loading CSS murni -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: 'class' };
  </script>

  <script>
    // PWA Prompt Logging Deferred
    window.addEventListener('load', () => {
      let deferredPrompt;
      const installBtn = document.getElementById('btn-install');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.remove('hidden');
        installBtn.classList.add('inline-flex');
      });
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') installBtn.classList.add('hidden');
          deferredPrompt = null;
        } else if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
          alert('Untuk memasang di iPhone/iPad: Tekan ikon "Share" di Safari, lalu "Add to Home Screen".');
        }
      });
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.navigator.standalone) {
        installBtn.classList.remove('hidden');
        installBtn.classList.add('inline-flex');
      }
      window.addEventListener('appinstalled', () => installBtn.classList.add('hidden'));
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);
    });

    let i18nDictionary = {};
    let SPKLU_NETWORK = [];
    let HIGHWAY_GRAPH = {};
    let CITIES = [];
    let currentLang = localStorage.getItem('lang') || 'id';

    let selectedSegmentFilter = null;
    let selectedSpeedFilter = 'all';
    let selectedConnectors = new Set(['CCS2', 'Chademo', 'AC']);
    let openDropdownId = null;

    function animatedRouting(resetSegment = false) {
      if (resetSegment) selectedSegmentFilter = null;

      if (document.startViewTransition) {
        document.startViewTransition(() => {
          runRouting();
        });
      } else {
        runRouting();
      }
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      setTheme(isDark ? 'light' : 'dark');
    }

    function setTheme(theme) {
      const darkIcon = document.getElementById('theme-icon-dark');
      const lightIcon = document.getElementById('theme-icon-light');

      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        if (darkIcon) darkIcon.classList.remove('hidden');
        if (lightIcon) lightIcon.classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        if (darkIcon) darkIcon.classList.add('hidden');
        if (lightIcon) lightIcon.classList.remove('hidden');
      }
      localStorage.setItem('theme', theme);
    }

    function t(key) {
      if (!i18nDictionary[currentLang]) return key;
      return i18nDictionary[currentLang][key] || key;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.title = t('seo_title') || 'SPKLU Trans Jawa • Peta Cas Mobil Listrik Rest Area Tol';
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc && t('seo_desc') !== 'seo_desc') metaDesc.setAttribute('content', t('seo_desc'));

      const btnId = document.getElementById('btn-id');
      const btnEn = document.getElementById('btn-en');
      if(btnId) btnId.className = `px-2.5 py-1 min-h-[32px] text-xs font-bold rounded transition-all ${lang === 'id' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}`;
      if(btnEn) btnEn.className = `px-2.5 py-1 min-h-[32px] text-xs font-bold rounded transition-all ${lang === 'en' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white'}`;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'OPTION') el.textContent = t(key);
        else if (el.tagName === 'INPUT' && el.type === 'text') el.placeholder = t(key);
        else if (el.hasAttribute('title')) el.title = t(key);
        else el.textContent = t(key);
      });

      const kmInput = document.getElementById("current-km");
      if (kmInput) kmInput.placeholder = t('km_ph');
      const batteryInput = document.getElementById("battery-range");
      if (batteryInput) batteryInput.placeholder = t('battery_ph');

      animatedRouting(false);
    }

    function populateDropdowns(cities) {
      renderDropdownItems('origin', cities, 'jakarta');
      renderDropdownItems('destination', cities, 'surabaya');
    }

    function renderDropdownItems(type, cities, defaultVal) {
      const listContainer = document.getElementById(`${type}-list`);
      const label = document.getElementById(`${type}-label`);
      const input = document.getElementById(type);

      if (defaultVal) {
        input.value = defaultVal;
        const initialCity = CITIES.find(c => c.id === defaultVal);
        if (initialCity) label.textContent = initialCity.name;
      }

      const currentSelected = input.value;

      if (!cities || cities.length === 0) {
        listContainer.innerHTML = `<div class="px-3 py-4 text-center text-sm text-slate-500 font-medium">Kota tidak ditemukan</div>`;
        return;
      }

      listContainer.innerHTML = cities.map(city => {
        const isSelected = city.id === currentSelected;
        return `
          <button type="button" aria-selected="${isSelected}" onclick="selectCity('${type}', '${city.id}', '${city.name}')" class="w-full flex items-center justify-between px-3 py-3 min-h-[44px] text-sm font-bold rounded-xl transition-all duration-150 ${isSelected ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-500/15 dark:text-emerald-400' : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            <span>${city.name}</span>
            ${isSelected ? '<span class="text-emerald-700 dark:text-emerald-400 text-sm">✓</span>' : ''}
          </button>
        `;
      }).join("");
    }

    function filterCities(type) {
      const searchInput = document.getElementById(`${type}-search`);
      const query = (searchInput.value || "").toLowerCase().trim();
      const filtered = CITIES.filter(c => c.name.toLowerCase().includes(query) || c.id.toLowerCase().includes(query));
      renderDropdownItems(type, filtered);
    }

    function toggleDropdown(type) {
      const menu = document.getElementById(`${type}-menu`);
      const chevron = document.getElementById(`${type}-chevron`);
      const isCurrentlyOpen = openDropdownId === type;

      closeAllDropdowns();

      if (!isCurrentlyOpen) {
        const searchInput = document.getElementById(`${type}-search`);
        if (searchInput) {
          searchInput.value = '';
          renderDropdownItems(type, CITIES);
        }
        menu.classList.remove('hidden');
        if (chevron) chevron.classList.add('rotate-180');
        openDropdownId = type;

        setTimeout(() => {
          if (searchInput) searchInput.focus();
        }, 50);
      }
    }

    function closeAllDropdowns() {
      ['origin', 'destination'].forEach(type => {
        const menu = document.getElementById(`${type}-menu`);
        const chevron = document.getElementById(`${type}-chevron`);
        if (menu) menu.classList.add('hidden');
        if (chevron) chevron.classList.remove('rotate-180');
      });
      openDropdownId = null;
    }

    function selectCity(type, id, name) {
      document.getElementById(type).value = id;
      document.getElementById(`${type}-label`).textContent = name;
      closeAllDropdowns();

      renderDropdownItems(type, CITIES, id);
      animatedRouting(true);
    }

    function swapLocations() {
      const swapBtn = document.getElementById("btn-swap");
      swapBtn.classList.toggle("swap-active");

      const originInput = document.getElementById("origin");
      const destInput = document.getElementById("destination");

      const tempVal = originInput.value;
      originInput.value = destInput.value;
      destInput.value = tempVal;

      const originCity = CITIES.find(c => c.id === originInput.value);
      const destCity = CITIES.find(c => c.id === destInput.value);

      if (originCity) {
        document.getElementById("origin-label").textContent = originCity.name;
        renderDropdownItems('origin', CITIES, originInput.value);
      }
      if (destCity) {
        document.getElementById("destination-label").textContent = destCity.name;
        renderDropdownItems('destination', CITIES, destInput.value);
      }

      animatedRouting(true);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#dropdown-origin-wrapper') && !e.target.closest('#dropdown-destination-wrapper')) {
        closeAllDropdowns();
      }
    });

    function clearKm() {
      const input = document.getElementById("current-km");
      if(input) {
        input.value = "";
        input.focus();
      }
      animatedRouting(false);
    }

    function toggleSegmentFilter(segKey) {
      selectedSegmentFilter = (selectedSegmentFilter === segKey) ? null : segKey;
      animatedRouting(false);
    }

    function setSpeedFilter(minPower) {
      selectedSpeedFilter = minPower;
      ['all', '50', '100', '200'].forEach(val => {
        const btn = document.getElementById(`btn-speed-${val}`);
        if(btn) {
           btn.setAttribute('aria-pressed', val === minPower ? "true" : "false");
           if (val === minPower) {
             btn.className = "px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm";
           } else {
             btn.className = "px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
           }
        }
      });
      animatedRouting(false);
    }

    function toggleConnector(type) {
      if (selectedConnectors.has(type)) {
        if (selectedConnectors.size > 1) {
          selectedConnectors.delete(type);
        }
      } else {
        selectedConnectors.add(type);
      }

      ['CCS2', 'Chademo', 'AC'].forEach(tp => {
        const btn = document.getElementById(`btn-conn-${tp.toLowerCase()}`);
        if(btn) {
          const isActive = selectedConnectors.has(tp);
          btn.setAttribute('aria-pressed', isActive ? "true" : "false");
          if (isActive) {
            btn.className = "px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all bg-emerald-700 text-white shadow-sm dark:bg-emerald-600 dark:text-white active:scale-95";
          } else {
            btn.className = "px-2.5 py-1.5 min-h-[36px] rounded-md text-[11px] sm:text-xs font-bold transition-all text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white active:scale-95";
          }
        }
      });

      animatedRouting(false);
    }

    function formatSegment(segment, side) {
      const parts = segment.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1));
      if (side === 'B') {
        return `${parts[1]} → ${parts[0]}`;
      }
      return `${parts[0]} → ${parts[1]}`;
    }

    function findRoute(start, end) {
      if (start === end) return null;
      let queue = [[start, []]];
      let visited = new Set([start]);

      while (queue.length > 0) {
        let [current, path] = queue.shift();
        if (current === end) return path;

        const neighbors = HIGHWAY_GRAPH[current] || [];
        for (let edge of neighbors) {
          if (!visited.has(edge.to)) {
            visited.add(edge.to);
            queue.push([edge.to, [...path, edge]]);
          }
        }
      }
      return null;
    }

    function getBrandDot(brand) {
      const b = (brand || '').toUpperCase();
      if (b.includes('WULING')) return 'bg-rose-500';
      if (b.includes('ASTRA')) return 'bg-sky-600';
      if (b.includes('IGREEN')) return 'bg-teal-500';
      return 'bg-emerald-600 dark:bg-emerald-500';
    }

    function runRouting() {
      if (SPKLU_NETWORK.length === 0 || Object.keys(HIGHWAY_GRAPH).length === 0) return;

      const origin = document.getElementById("origin").value;
      const destination = document.getElementById("destination").value;
      const currentKmVal = document.getElementById("current-km").value.trim();
      const hasCurrentKm = currentKmVal !== "" && !isNaN(parseFloat(currentKmVal));
      const curKm = hasCurrentKm ? parseFloat(currentKmVal) : null;

      const batteryRangeVal = document.getElementById("battery-range").value.trim();
      const hasBatteryRange = batteryRangeVal !== "" && !isNaN(parseFloat(batteryRangeVal));
      const batteryRange = hasBatteryRange ? parseFloat(batteryRangeVal) : null;
      const filterWithinRange = document.getElementById("filter-within-range").checked;

      const resultsContainer = document.getElementById("results-list");
      const corridorSummary = document.getElementById("corridor-summary");
      const matchCounter = document.getElementById("match-counter");

      if (origin === destination) {
        corridorSummary.innerHTML = "";
        matchCounter.textContent = `0 ${t('spots_ahead')}`;
        resultsContainer.innerHTML = `
          <div class="text-center py-10 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl bg-white/80 dark:bg-slate-900/40 animate-ios-card">
            <p class="text-slate-600 dark:text-slate-400 text-sm font-bold">${t('err_same_city')}</p>
          </div>
        `;
        return;
      }

      const legs = findRoute(origin, destination);
      if (!legs) {
        resultsContainer.innerHTML = `
          <div class="p-6 text-center text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700 rounded-2xl bg-white/80 dark:bg-slate-900/40 animate-ios-card text-sm font-bold">
            ${t('err_no_route')}
          </div>
        `;
        return;
      }

      let chipsMarkup = `
        <button type="button" aria-pressed="${selectedSegmentFilter === null}" onclick="selectedSegmentFilter = null; animatedRouting(false)" class="whitespace-nowrap shrink-0 px-3 py-1.5 min-h-[36px] rounded-lg text-xs font-bold transition-all duration-200 ${selectedSegmentFilter === null ? 'bg-slate-800 text-white dark:bg-slate-700 shadow-sm' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 dark:bg-slate-900 dark:text-slate-300 dark:border-slate-700'} active:scale-95">
          ${t('all_segments')}
        </button>
      `;

      chipsMarkup += legs.map(leg => {
        const isSelected = selectedSegmentFilter === leg.segment;
        return `
          <button type="button" aria-pressed="${isSelected}" onclick="toggleSegmentFilter('${leg.segment}')" class="whitespace-nowrap shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 min-h-[36px] rounded-lg text-xs font-mono transition-all duration-200 ${isSelected ? 'bg-emerald-700 text-white dark:bg-emerald-600 dark:text-white font-bold shadow-sm' : 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-300'} active:scale-95">
            <span class="w-4 h-4 rounded text-[10px] font-black flex items-center justify-center ${isSelected ? 'bg-white/20 text-white' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-400'}">${leg.side}</span>
            <span class="font-bold">${formatSegment(leg.segment, leg.side)}</span>
          </button>
        `;
      }).join("");

      corridorSummary.innerHTML = chipsMarkup;

      let matchedStations = [];
      legs.forEach(leg => {
        let stationsOnLeg = SPKLU_NETWORK.filter(s => s.segment === leg.segment && s.side === leg.side);
        stationsOnLeg.sort((a, b) => leg.order === 'asc' ? a.km - b.km : b.km - a.km);
        stationsOnLeg.forEach(s => {
          matchedStations.push({ ...s, legOrder: leg.order });
        });
      });

      if (selectedSegmentFilter) {
        matchedStations = matchedStations.filter(s => s.segment === selectedSegmentFilter);
      }

      if (selectedConnectors.size > 0 && selectedConnectors.size < 3) {
        matchedStations = matchedStations.filter(s => 
          (s.types || []).some(tp => selectedConnectors.has(tp))
        );
      }

      let passedCount = 0;
      if (hasCurrentKm) {
        const totalBefore = matchedStations.length;
        matchedStations = matchedStations.filter(s => {
          if (s.legOrder === 'asc') {
            return s.km >= curKm;
          } else {
            return s.km <= curKm;
          }
        });
        passedCount = totalBefore - matchedStations.length;
      }

      if (selectedSpeedFilter !== 'all') {
        const minKW = parseInt(selectedSpeedFilter, 10);
        matchedStations = matchedStations.filter(s => s.highest_power >= minKW);
      }

      matchedStations = matchedStations.map((s, idx, arr) => {
        let distAhead = null;
        let distFromPrev = null;

        if (hasCurrentKm) {
          distAhead = s.legOrder === 'asc' ? (s.km - curKm) : (curKm - s.km);
          if (distAhead < 0) distAhead = 0;
        }

        distFromPrev = idx === 0 ? 0 : Math.abs(s.km - arr[idx - 1].km);
        const isWithinBattery = hasBatteryRange && distAhead !== null ? (distAhead <= batteryRange) : null;

        return {
          ...s,
          distAhead,
          distFromPrev,
          isWithinBattery
        };
      });

      if (filterWithinRange && hasBatteryRange && hasCurrentKm) {
        matchedStations = matchedStations.filter(s => s.isWithinBattery);
      }

      const ultraCount = matchedStations.filter(s => s.highest_power >= 200).length;
      let counterText = `${matchedStations.length} ${t('spots_ahead')} (${ultraCount} ${t('speed_ultra')} 200 kW)`;
      if (passedCount > 0) {
        counterText += ` • <span class="text-amber-700 dark:text-amber-400 font-bold">${passedCount} ${t('past_hidden')}</span>`;
      }
      matchCounter.innerHTML = counterText;

      if (matchedStations.length === 0) {
        resultsContainer.innerHTML = `
          <div class="text-center py-10 border border-slate-300 dark:border-slate-800 bg-white/80 dark:bg-slate-900/40 rounded-2xl animate-ios-card shadow-sm">
            <p class="text-slate-600 dark:text-slate-400 text-sm font-bold">${t('err_no_match')}</p>
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = matchedStations.map((s, idx) => {
        let powerLabel = t('speed_fast');
        if (s.highest_power >= 200) powerLabel = t('speed_ultra');
        else if (s.highest_power >= 100) powerLabel = t('speed_rapid');

        const totalMachines = (s.chargers || []).length;
        const totalPorts = (s.chargers || []).reduce((acc, c) => acc + (c.total_ports || (c.ports ? c.ports.length : 1)), 0);

        const unitLabel = t('label_unit') || 'Mesin';
        const portLabel = t('label_port') || 'Port';

        let capacityBadge = '';
        if (totalMachines > 4 && totalPorts > 10) {
          capacityBadge = `
            <span class="inline-flex items-center gap-1 font-mono text-[11px] font-extrabold px-2.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300 dark:bg-emerald-500/20 dark:text-emerald-400 dark:border-emerald-500/30">
              ⚡⚡ ${totalMachines} ${unitLabel} (${totalPorts} ${portLabel})
            </span>
          `;
        } else if (totalMachines <= 1) {
          capacityBadge = `
            <span class="inline-flex items-center font-mono text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-slate-200 text-slate-700 border border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700">
              ${totalMachines} ${unitLabel} (${totalPorts} ${portLabel})
            </span>
          `;
        } else {
          capacityBadge = `
            <span class="inline-flex items-center gap-1 font-mono text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-sky-100 text-sky-800 border border-sky-300 dark:bg-sky-500/20 dark:text-sky-400 dark:border-sky-500/30">
              ⚡ ${totalMachines} ${unitLabel} (${totalPorts} ${portLabel})
            </span>
          `;
        }

        let distanceBadge = '';
        if (hasCurrentKm && s.distAhead !== null) {
          distanceBadge = `
            <span class="inline-flex items-center font-mono font-extrabold text-[11px] px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-300 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/30">
              📍 ${s.distAhead} ${t('km_ahead')}
            </span>
          `;
        } else {
          distanceBadge = idx === 0 
            ? `<span class="inline-flex items-center font-mono text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700">${t('first_stop')}</span>`
            : `<span class="inline-flex items-center font-mono text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700">🚗 +${s.distFromPrev} ${t('from_prev_stop')}</span>`;
        }

        let batteryBadge = '';
        if (hasBatteryRange && hasCurrentKm) {
          batteryBadge = s.isWithinBattery
            ? `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-300 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/30">✓ ${t('within_battery')}</span>`
            : `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-rose-50 text-rose-800 border border-rose-300 dark:bg-rose-500/10 dark:text-rose-400 dark:border-rose-500/30">⚠️ ${t('outside_battery')}</span>`;
        }

        const dispenserGroupMap = {};
        (s.chargers || []).forEach(c => {
          const portCountMap = {};
          (c.ports || []).forEach(p => {
            const key = `${p.type} ${p.power}`;
            portCountMap[key] = (portCountMap[key] || 0) + 1;
          });

          const portSummaries = Object.entries(portCountMap).map(([desc, count]) => {
            return count > 1 ? `${count}× ${desc}` : desc;
          }).join(" • ");

          const signature = `${c.brand}___${portSummaries}`;
          if (!dispenserGroupMap[signature]) {
            dispenserGroupMap[signature] = {
              brand: c.brand,
              portSummaries: portSummaries,
              count: 0
            };
          }
          dispenserGroupMap[signature].count += 1;
        });

        const dispenserList = Object.values(dispenserGroupMap).map(item => {
          const machineCountPrefix = item.count > 1 ? `<span class="font-extrabold text-emerald-800 dark:text-emerald-400 mr-0.5">${item.count}×</span>` : '';
          return `
            <div class="inline-flex items-center gap-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs">
              <span class="w-2 h-2 rounded-full ${getBrandDot(item.brand)} shrink-0"></span>
              <span class="font-bold text-slate-800 dark:text-slate-200 text-[11px]">${machineCountPrefix}${item.brand}</span>
              <span class="text-slate-300 dark:text-slate-600 text-[10px]" aria-hidden="true">|</span>
              <span class="font-mono text-slate-800 dark:text-slate-200 text-[11px] font-bold">${item.portSummaries}</span>
            </div>
          `;
        }).join("");

        const staggerDelay = Math.min(idx * 28, 250);

        return `
        <article style="animation-delay: ${staggerDelay}ms" class="animate-ios-card group bg-white dark:bg-slate-900/60 hover:bg-slate-50/80 dark:hover:bg-slate-900/90 border border-slate-300 dark:border-slate-700/80 hover:border-slate-400 dark:hover:border-slate-600 rounded-2xl p-3.5 sm:p-4 transition-all duration-200 shadow-sm hover:shadow-md">
          
          <div class="flex items-center justify-between gap-1.5 pb-2.5 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-mono text-xs font-extrabold px-2.5 py-0.5 rounded-md bg-emerald-100 text-emerald-900 border border-emerald-300 dark:bg-emerald-500/20 dark:text-emerald-400 dark:border-emerald-500/30">
                KM ${s.km}
              </span>
              <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-md ${s.side === 'A' ? 'bg-sky-100 text-sky-900 border border-sky-300 dark:bg-sky-500/20 dark:text-sky-400 dark:border-sky-500/30' : 'bg-purple-100 text-purple-900 border border-purple-300 dark:bg-purple-500/20 dark:text-purple-400 dark:border-purple-500/30'}">
                ${s.side}
              </span>
              ${capacityBadge}
              ${distanceBadge}
              ${batteryBadge}
            </div>

            <div class="text-right shrink-0">
              <span class="font-mono font-extrabold text-base text-slate-900 dark:text-white">
                ${s.lowest_power !== s.highest_power ? `${s.lowest_power}~${s.highest_power}` : s.highest_power}<span class="text-xs font-sans font-bold text-slate-500 ml-0.5">kW</span>
              </span>
              <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 ml-1 hidden sm:inline">${powerLabel}</span>
            </div>
          </div>

          <div class="mt-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="font-extrabold text-slate-900 dark:text-white text-base leading-tight group-hover:text-emerald-700 dark:group-hover:text-emerald-400 transition-colors">
                ${s.name}
              </h2>
              <span class="text-[11px] text-slate-500 dark:text-slate-400 font-bold">
                ${formatSegment(s.segment, s.side)}
              </span>
            </div>

            <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
              <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" aria-label="Buka di Google Maps" target="_blank" rel="noopener" 
                 class="inline-flex items-center gap-1.5 px-3.5 py-2 min-h-[36px] rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs shadow-sm active:scale-95 transition-all">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>Maps</span>
              </a>
              <a href="https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes" aria-label="Buka di Waze" target="_blank" rel="noopener" 
                 class="inline-flex items-center gap-1.5 px-3.5 py-2 min-h-[36px] rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs shadow-sm active:scale-95 transition-all">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20.5 12c0-4.69-3.81-8.5-8.5-8.5S3.5 7.31 3.5 12c0 2.21.84 4.22 2.22 5.73l-1.16 3.48c-.14.42.24.83.67.72l3.65-.91c1.37.63 2.91.98 4.54.98 4.69 0 8.5-3.81 8.5-8.5zm-11 1.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>Waze</span>
              </a>
            </div>
          </div>

          <div class="mt-2.5 flex flex-wrap gap-1.5">
            ${dispenserList}
          </div>
        </article>
      `;
      }).join("");
    }

    function setupCorridorDesktopScroll() {
      const el = document.getElementById("corridor-summary");
      if (!el) return;

      el.addEventListener("wheel", (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          el.scrollLeft += e.deltaY * 0.9;
        }
      }, { passive: false });

      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;

      el.addEventListener("mousedown", (e) => {
        isDown = true;
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
      });

      el.addEventListener("mouseleave", () => { isDown = false; });
      el.addEventListener("mouseup", () => { isDown = false; });

      el.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - el.offsetLeft;
        const walk = (x - startX) * 1.5;
        el.scrollLeft = scrollLeft - walk;
      });
    }

    // Eksekusi Logika Inisiasi dan Hilangkan Loader
    async function initApp() {
      const list = document.getElementById("results-list");
      const loader = document.getElementById("initial-loader");
      const appContent = document.getElementById("app-content");

      initTheme();
      setupCorridorDesktopScroll();

      try {
        const [langRes, stationsRes, graphRes, citiesRes] = await Promise.all([
          fetch("i18n.json"),
          fetch("stations.json"),
          fetch("highway.json"),
          fetch("cities.json")
        ]);

        if (!langRes.ok) throw new Error(`i18n.json error ${langRes.status}`);
        if (!stationsRes.ok) throw new Error(`stations.json error ${stationsRes.status}`);
        if (!graphRes.ok) throw new Error(`highway.json error ${graphRes.status}`);
        if (!citiesRes.ok) throw new Error(`cities.json error ${citiesRes.status}`);
        
        i18nDictionary = await langRes.json();
        SPKLU_NETWORK = await stationsRes.json();
        HIGHWAY_GRAPH = await graphRes.json();
        CITIES = await citiesRes.json();

        populateDropdowns(CITIES);
        setLang(currentLang);
        
        // Data siap, hilangkan loader dan tampilkan aplikasi
        setTimeout(() => {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          appContent.style.opacity = '1';
        }, 150); // Delay halus agar animasi transisi terlihat profesional
        
      } catch (err) {
        console.error("Initialization Failed:", err);
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        appContent.style.opacity = '1';

        list.innerHTML = `
          <div class="p-6 text-center text-rose-700 bg-rose-50 border border-rose-300 dark:text-rose-400 dark:bg-rose-900/20 dark:border-rose-800/60 rounded-2xl text-sm font-bold animate-ios-card">
            Gagal memuat data SPKLU. Pastikan koneksi internet aktif.
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
