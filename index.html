<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trans Java EV Rest Area Locator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="h-9 w-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-lg">
          ⚡
        </div>
        <span data-i18n="title" class="font-extrabold text-white text-base sm:text-lg tracking-tight">SPKLU Trans Jawa</span>
      </div>
      
      <!-- Language Toggle -->
      <div class="flex items-center bg-slate-800/80 rounded-lg p-1 border border-slate-700">
        <button onclick="setLang('id')" id="btn-id" class="px-2.5 py-1 text-[11px] font-bold rounded-md transition-colors bg-emerald-500 text-slate-950">ID</button>
        <button onclick="setLang('en')" id="btn-en" class="px-2.5 py-1 text-[11px] font-bold rounded-md transition-colors text-slate-400 hover:text-white">EN</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-grow">
    
    <!-- Planner Box -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 md:p-6 shadow-2xl mb-6">
      
      <!-- Route Pickers with Swap Action Button -->
      <div class="flex flex-col md:flex-row items-center gap-3">
        
        <!-- Origin -->
        <div class="w-full flex-1">
          <label data-i18n="dep_label" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Keberangkatan</label>
          <div class="relative">
            <select id="origin" onchange="runRouting()" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-white text-sm font-semibold focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition appearance-none cursor-pointer">
              <!-- Dynamically populated from cities.json -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
              <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
            </div>
          </div>
        </div>

        <!-- Swap Button -->
        <div class="flex items-center justify-center -my-1 md:my-0 md:pt-6">
          <button type="button" onclick="swapLocations()" data-i18n="swap_tooltip" title="Tukar Keberangkatan & Tujuan" class="h-11 w-11 rounded-xl bg-slate-800 hover:bg-emerald-500 hover:text-slate-950 text-emerald-400 border border-slate-700/80 transition-all flex items-center justify-center shadow-lg active:scale-90 group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-300 group-hover:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
            </svg>
          </button>
        </div>

        <!-- Destination -->
        <div class="w-full flex-1">
          <label data-i18n="dest_label" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Tujuan</label>
          <div class="relative">
            <select id="destination" onchange="runRouting()" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-white text-sm font-semibold focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition appearance-none cursor-pointer">
              <!-- Dynamically populated from cities.json -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
              <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Filters & Active Corridor Indicator -->
      <div class="mt-5 pt-4 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div id="corridor-summary" class="text-slate-300 font-medium flex items-center gap-2 flex-wrap leading-relaxed"></div>

        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto mt-2 sm:mt-0">
          
          <!-- Current KM Position Input -->
          <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-700/80 rounded-lg px-2.5 py-1 text-slate-400 focus-within:border-emerald-500 focus-within:text-white transition">
            <span class="text-[11px] font-bold font-mono text-emerald-400">KM</span>
            <input type="number" id="current-km" oninput="runRouting()" placeholder="KM..." class="w-16 bg-transparent text-white placeholder-slate-500 text-xs focus:outline-none font-mono">
            <button type="button" onclick="clearKm()" class="text-slate-500 hover:text-slate-300 text-xs px-0.5" title="Clear">✕</button>
          </div>

          <!-- Power Filter -->
          <select id="power-filter" onchange="runRouting()" class="bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-1.5 text-slate-300 text-xs focus:outline-none focus:border-emerald-500 cursor-pointer">
            <option data-i18n="pow_all" value="all">Semua Daya</option>
            <option data-i18n="pow_50" value="50">≥ 50 kW</option>
            <option data-i18n="pow_100" value="100">≥ 100 kW</option>
            <option data-i18n="pow_200" value="200">200 kW (Ultra)</option>
          </select>

          <!-- Text Search Filter -->
          <input type="text" data-i18n="search_ph" id="search-box" oninput="runRouting()" placeholder="Cari rest area..." class="bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-1.5 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-emerald-500 flex-grow sm:flex-grow-0 sm:w-40">
        </div>
      </div>
    </div>

    <!-- Live Stats Bar -->
    <div id="stats-banner" class="flex items-center justify-between px-2 mb-3 text-xs text-slate-400 font-semibold">
      <span id="match-counter" data-i18n="loading">Memuat jaringan...</span>
      <span data-i18n="sort_info" class="text-slate-500 hidden sm:block">Diurutkan sesuai arah jalan</span>
    </div>

    <!-- SPKLU Cards Container -->
    <div id="results-list" class="space-y-3">
      <div class="p-8 text-center text-slate-500 border border-slate-800 rounded-xl bg-slate-900/50" data-i18n="loading">
        Memuat data...
      </div>
    </div>
  </main>

  <footer data-i18n="footer" class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    Pencari SPKLU Tol Trans-Jawa • Mandiri & Bebas Biaya
  </footer>

  <script>
    // --- GLOBAL STATE ---
    let i18nDictionary = {};
    let SPKLU_NETWORK = [];
    let HIGHWAY_GRAPH = {};
    let CITIES = [];
    let currentLang = localStorage.getItem('lang') || 'id';

    function t(key) {
      if (!i18nDictionary[currentLang]) return key;
      return i18nDictionary[currentLang][key] || key;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.getElementById('btn-id').className = `px-2.5 py-1 text-[11px] font-bold rounded-md transition-colors ${lang === 'id' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`;
      document.getElementById('btn-en').className = `px-2.5 py-1 text-[11px] font-bold rounded-md transition-colors ${lang === 'en' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'OPTION') {
            el.textContent = t(key);
        } else if (el.tagName === 'INPUT' && el.type === 'text') {
            el.placeholder = t(key);
        } else if (el.hasAttribute('title')) {
            el.title = t(key);
        } else {
            el.textContent = t(key);
        }
      });

      const kmInput = document.getElementById("current-km");
      if (kmInput) kmInput.placeholder = t('km_ph');

      runRouting();
    }

    function populateDropdowns(cities) {
      const originEl = document.getElementById("origin");
      const destEl = document.getElementById("destination");

      const optionsMarkup = cities.map(city => `<option value="${city.id}">${city.name}</option>`).join("");

      originEl.innerHTML = optionsMarkup;
      destEl.innerHTML = optionsMarkup;

      originEl.value = "jakarta";
      destEl.value = "surabaya";
    }

    function swapLocations() {
      const originEl = document.getElementById("origin");
      const destEl = document.getElementById("destination");
      const temp = originEl.value;
      originEl.value = destEl.value;
      destEl.value = temp;
      runRouting();
    }

    function clearKm() {
      document.getElementById("current-km").value = "";
      runRouting();
    }

    // Capital Case & Direction-Aware Segment Formatter
    function formatSegment(segment, side) {
      const parts = segment.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1));
      // In Jalur B (return direction), reverse cities for natural reading
      if (side === 'B') {
        return `${parts[1]} → ${parts[0]}`;
      }
      return `${parts[0]} → ${parts[1]}`;
    }

    function findRoute(start, end) {
      if (start === end) return null;
      let queue = [[start, []]];
      let visited = new Set([start]);

      while (queue.length > 0) {
        let [current, path] = queue.shift();
        if (current === end) return path;

        const neighbors = HIGHWAY_GRAPH[current] || [];
        for (let edge of neighbors) {
          if (!visited.has(edge.to)) {
            visited.add(edge.to);
            queue.push([edge.to, [...path, edge]]);
          }
        }
      }
      return null;
    }

    function runRouting() {
      if (SPKLU_NETWORK.length === 0 || Object.keys(HIGHWAY_GRAPH).length === 0) return;

      const origin = document.getElementById("origin").value;
      const destination = document.getElementById("destination").value;
      const powerLimit = document.getElementById("power-filter").value;
      const search = document.getElementById("search-box").value.toLowerCase().trim();
      const currentKmVal = document.getElementById("current-km").value.trim();
      const hasCurrentKm = currentKmVal !== "" && !isNaN(parseFloat(currentKmVal));
      const curKm = hasCurrentKm ? parseFloat(currentKmVal) : null;

      const resultsContainer = document.getElementById("results-list");
      const corridorSummary = document.getElementById("corridor-summary");
      const matchCounter = document.getElementById("match-counter");

      if (origin === destination) {
        corridorSummary.innerHTML = "";
        matchCounter.textContent = `0 ${t('found')}`;
        resultsContainer.innerHTML = `<div class="text-center py-12 border border-dashed border-slate-800 rounded-xl"><p class="text-slate-400 text-sm">${t('err_same_city')}</p></div>`;
        return;
      }

      const legs = findRoute(origin, destination);
      if (!legs) {
        resultsContainer.innerHTML = `<div class="p-6 text-center text-slate-400">${t('err_no_route')}</div>`;
        return;
      }

      // Display corridors formatted and reversed for Jalur B
      corridorSummary.innerHTML = legs.map((leg, idx) => `
        <span class="inline-flex items-center gap-1.5 bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md text-[11px] font-mono border border-slate-700/60">
          <span class="text-emerald-400 font-bold">Jalur ${leg.side}</span> ${formatSegment(leg.segment, leg.side)}
        </span>
        ${idx < legs.length - 1 ? '<span class="text-slate-600 px-0.5">→</span>' : ''}
      `).join("");

      // Collect matched stations in sequential driving order
      let matchedStations = [];
      legs.forEach(leg => {
        let stationsOnLeg = SPKLU_NETWORK.filter(s => s.segment === leg.segment && s.side === leg.side);
        stationsOnLeg.sort((a, b) => leg.order === 'asc' ? a.km - b.km : b.km - a.km);
        stationsOnLeg.forEach(s => {
          matchedStations.push({ ...s, legOrder: leg.order });
        });
      });

      // Filter passed rest areas based on Current KM input
      let passedCount = 0;
      if (hasCurrentKm) {
        const totalBefore = matchedStations.length;
        matchedStations = matchedStations.filter(s => {
          // In ascending direction (Jalur A), passed if station.km < current KM
          // In descending direction (Jalur B), passed if station.km > current KM
          if (s.legOrder === 'asc') {
            return s.km >= curKm;
          } else {
            return s.km <= curKm;
          }
        });
        passedCount = totalBefore - matchedStations.length;
      }

      // Power filter
      if (powerLimit !== "all") {
        const minKW = parseInt(powerLimit, 10);
        matchedStations = matchedStations.filter(s => s.power >= minKW);
      }

      // Keyword search
      if (search) {
        matchedStations = matchedStations.filter(s => 
          s.name.toLowerCase().includes(search) || 
          s.brand.toLowerCase().includes(search) ||
          `km ${s.km}`.includes(search)
        );
      }

      // Update counters & status banner
      const ultraCount = matchedStations.filter(s => s.power >= 200).length;
      let counterText = `${matchedStations.length} ${t('found')} (${ultraCount} ${t('ultra_fast')} 200 kW)`;
      if (passedCount > 0) {
        counterText += ` • <span class="text-amber-400 font-normal">${passedCount} ${t('passed_hidden')}</span>`;
      }
      matchCounter.innerHTML = counterText;

      if (matchedStations.length === 0) {
        resultsContainer.innerHTML = `<div class="text-center py-12 border border-slate-800 bg-slate-900/50 rounded-xl"><p class="text-slate-400 text-sm">${t('err_no_match')}</p></div>`;
        return;
      }

      resultsContainer.innerHTML = matchedStations.map(s => {
        let powerLabel = t('fast_charger');
        if (s.power >= 200) powerLabel = t('ultra_fast');
        else if (s.power >= 100) powerLabel = t('rapid');

        return `
        <div class="bg-slate-900/90 border border-slate-800/90 hover:border-slate-700 rounded-xl p-4 sm:p-5 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1.5 flex-grow">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                KM ${s.km}
              </span>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded ${s.side === 'A' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-purple-500/10 text-purple-400 border border-purple-500/20'}">
                Jalur ${s.side}
              </span>
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700/60">
                ${s.brand}
              </span>
              <span class="text-[11px] font-medium text-slate-400">
                ${formatSegment(s.segment, s.side)}
              </span>
            </div>
            
            <h3 class="font-bold text-white text-base leading-snug">${s.name}</h3>
            <p class="text-xs text-slate-400">${s.type}</p>
          </div>

          <div class="flex items-center justify-between sm:flex-col sm:items-end gap-3 pt-3 sm:pt-0 border-t border-slate-800/60 sm:border-t-0">
            <div class="text-left sm:text-right">
              <span class="text-xl sm:text-2xl font-black font-mono tracking-tight ${s.power >= 200 ? 'text-amber-400' : s.power >= 100 ? 'text-emerald-400' : 'text-slate-200'}">
                ${s.power} <span class="text-xs font-sans font-bold text-slate-400">kW</span>
              </span>
              <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">
                ${powerLabel}
              </div>
            </div>

            <div class="flex items-center gap-2">
              <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener" 
                 class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 hover:text-emerald-300 font-semibold text-xs rounded-lg border border-slate-700 transition flex items-center gap-1">
                ${t('btn_maps')}
              </a>
              <a href="https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes" target="_blank" rel="noopener" 
                 class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-400 hover:text-sky-300 font-semibold text-xs rounded-lg border border-slate-700 transition flex items-center gap-1">
                ${t('btn_waze')}
              </a>
            </div>
          </div>
        </div>
      `;
      }).join("");
    }

    async function initApp() {
      const list = document.getElementById("results-list");

      try {
        const [langRes, stationsRes, graphRes, citiesRes] = await Promise.all([
          fetch("i18n.json"),
          fetch("stations.json"),
          fetch("highway.json"),
          fetch("cities.json")
        ]);

        if (!langRes.ok) throw new Error(`i18n.json error ${langRes.status}`);
        if (!stationsRes.ok) throw new Error(`stations.json error ${stationsRes.status}`);
        if (!graphRes.ok) throw new Error(`highway.json error ${graphRes.status}`);
        if (!citiesRes.ok) throw new Error(`cities.json error ${citiesRes.status}`);
        
        i18nDictionary = await langRes.json();
        SPKLU_NETWORK = await stationsRes.json();
        HIGHWAY_GRAPH = await graphRes.json();
        CITIES = await citiesRes.json();

        populateDropdowns(CITIES);
        setLang(currentLang);
        
      } catch (err) {
        console.error("Initialization Failed:", err);
        list.innerHTML = `<div class="p-6 text-center text-rose-400 bg-rose-950/20 border border-rose-800/40 rounded-xl text-sm">Failed to load JSON datasets. Check browser console for details.</div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
