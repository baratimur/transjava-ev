<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trans Java EV Rest Area Locator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Fluid entrance animations */
    @keyframes slideFadeUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-card {
      animation: slideFadeUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Smooth swap transition */
    .swap-active svg {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen antialiased flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

  <!-- Header -->
  <header class="border-b border-slate-800/60 bg-[#090d16]/85 backdrop-blur-md sticky top-0 z-30 transition-colors">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="h-8 w-8 rounded-lg bg-emerald-500/10 border border-emerald-500/25 flex items-center justify-center text-emerald-400 font-bold text-sm shadow-[0_0_15px_rgba(16,185,129,0.15)] transition-transform hover:scale-105">
          ⚡
        </div>
        <span data-i18n="title" class="font-extrabold text-white text-base tracking-tight">SPKLU Trans Jawa</span>
      </div>
      
      <!-- Language Toggle -->
      <div class="flex items-center bg-slate-900/90 rounded-lg p-0.5 border border-slate-800 text-xs">
        <button onclick="setLang('id')" id="btn-id" class="px-2.5 py-1 font-bold rounded-md transition-all duration-200 bg-emerald-500 text-slate-950 shadow-sm">ID</button>
        <button onclick="setLang('en')" id="btn-en" class="px-2.5 py-1 font-bold rounded-md transition-all duration-200 text-slate-400 hover:text-white">EN</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
    
    <!-- Planner Box -->
    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-xl backdrop-blur-sm mb-6 transition-all duration-200 hover:border-slate-700/80">
      
      <!-- Route Pickers with Swap Action Button -->
      <div class="flex flex-col sm:flex-row items-center gap-3">
        
        <!-- Origin -->
        <div class="w-full flex-1">
          <label data-i18n="dep_label" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mulai dari</label>
          <div class="relative">
            <select id="origin" onchange="runRouting()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white text-sm font-semibold focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all appearance-none cursor-pointer">
              <!-- Dynamically populated from cities.json -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500">
              <svg class="h-4 w-4 fill-current transition-transform" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
            </div>
          </div>
        </div>

        <!-- Swap Button -->
        <div class="flex items-center justify-center -my-1 sm:my-0 sm:pt-5">
          <button type="button" id="btn-swap" onclick="swapLocations()" data-i18n="swap_tooltip" title="Tukar arah rute" class="h-10 w-10 rounded-xl bg-slate-800/70 hover:bg-emerald-500 hover:text-slate-950 text-emerald-400 border border-slate-700/60 transition-all duration-300 flex items-center justify-center shadow-sm active:scale-90 group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
            </svg>
          </button>
        </div>

        <!-- Destination -->
        <div class="w-full flex-1">
          <label data-i18n="dest_label" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mau ke mana?</label>
          <div class="relative">
            <select id="destination" onchange="runRouting()" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white text-sm font-semibold focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all appearance-none cursor-pointer">
              <!-- Dynamically populated from cities.json -->
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500">
              <svg class="h-4 w-4 fill-current transition-transform" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Filters & Active Corridor Indicator -->
      <div class="mt-4 pt-3.5 border-t border-slate-800/60 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div id="corridor-summary" class="text-slate-300 font-medium flex items-center gap-1.5 flex-wrap transition-opacity duration-300"></div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <!-- Current KM Position Input -->
          <div class="flex items-center bg-slate-950/80 border border-slate-800 rounded-lg px-2.5 py-1.5 focus-within:border-emerald-500/80 focus-within:ring-2 focus-within:ring-emerald-500/10 transition-all">
            <span class="text-[10px] font-bold font-mono text-emerald-400 pr-1.5">KM</span>
            <input type="number" id="current-km" oninput="runRouting()" placeholder="KM..." class="w-16 bg-transparent text-white placeholder-slate-600 text-xs focus:outline-none font-mono">
            <button type="button" onclick="clearKm()" class="text-slate-500 hover:text-slate-300 text-xs transition-colors" title="Clear">✕</button>
          </div>

          <!-- Power Filter -->
          <select id="power-filter" onchange="runRouting()" class="bg-slate-950/80 border border-slate-800 rounded-lg px-2.5 py-1.5 text-slate-300 text-xs focus:outline-none focus:border-emerald-500/80 transition-all cursor-pointer">
            <option data-i18n="pow_all" value="all">Semua kecepatan</option>
            <option data-i18n="pow_50" value="50">Cepat (≥ 50 kW)</option>
            <option data-i18n="pow_100" value="100">Sangat cepat (≥ 100 kW)</option>
            <option data-i18n="pow_200" value="200">Ultra cepat (200 kW)</option>
          </select>

          <!-- Text Search Filter -->
          <input type="text" data-i18n="search_ph" id="search-box" oninput="runRouting()" placeholder="Cari nama atau KM..." class="bg-slate-950/80 border border-slate-800 rounded-lg px-3 py-1.5 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-emerald-500/80 focus:ring-2 focus:ring-emerald-500/10 transition-all flex-grow sm:flex-grow-0 sm:w-44">
        </div>
      </div>
    </div>

    <!-- Live Stats Bar -->
    <div id="stats-banner" class="flex items-center justify-between px-1 mb-3.5 text-xs text-slate-400 font-semibold transition-opacity duration-200">
      <span id="match-counter" data-i18n="loading">Mengecek tempat cas di sepanjang jalurmu...</span>
      <span data-i18n="sort_info" class="text-slate-500 text-[11px] hidden sm:block">Urut sesuai arah jalanmu</span>
    </div>

    <!-- SPKLU Cards Container -->
    <div id="results-list" class="space-y-3 transition-all duration-300">
      <div class="p-8 text-center text-slate-500 border border-slate-800/60 rounded-2xl bg-slate-900/20" data-i18n="loading">
        Mengecek tempat cas di sepanjang jalurmu...
      </div>
    </div>
  </main>

  <footer data-i18n="footer" class="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500 transition-colors">
    Panduan Nyaman SPKLU Tol Trans-Jawa • Dibuat untuk sesama pengendara EV
  </footer>

  <script>
    let i18nDictionary = {};
    let SPKLU_NETWORK = [];
    let HIGHWAY_GRAPH = {};
    let CITIES = [];
    let currentLang = localStorage.getItem('lang') || 'id';

    function t(key) {
      if (!i18nDictionary[currentLang]) return key;
      return i18nDictionary[currentLang][key] || key;
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;

      document.getElementById('btn-id').className = `px-2.5 py-1 font-bold rounded-md transition-all duration-200 ${lang === 'id' ? 'bg-emerald-500 text-slate-950 shadow-sm' : 'text-slate-400 hover:text-white'}`;
      document.getElementById('btn-en').className = `px-2.5 py-1 font-bold rounded-md transition-all duration-200 ${lang === 'en' ? 'bg-emerald-500 text-slate-950 shadow-sm' : 'text-slate-400 hover:text-white'}`;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (el.tagName === 'OPTION') {
          el.textContent = t(key);
        } else if (el.tagName === 'INPUT' && el.type === 'text') {
          el.placeholder = t(key);
        } else if (el.hasAttribute('title')) {
          el.title = t(key);
        } else {
          el.textContent = t(key);
        }
      });

      const kmInput = document.getElementById("current-km");
      if (kmInput) kmInput.placeholder = t('km_ph');

      runRouting();
    }

    function populateDropdowns(cities) {
      const originEl = document.getElementById("origin");
      const destEl = document.getElementById("destination");
      const optionsMarkup = cities.map(city => `<option value="${city.id}">${city.name}</option>`).join("");
      originEl.innerHTML = optionsMarkup;
      destEl.innerHTML = optionsMarkup;
      originEl.value = "jakarta";
      destEl.value = "surabaya";
    }

    function swapLocations() {
      const swapBtn = document.getElementById("btn-swap");
      swapBtn.classList.toggle("swap-active");

      const originEl = document.getElementById("origin");
      const destEl = document.getElementById("destination");
      const temp = originEl.value;
      originEl.value = destEl.value;
      destEl.value = temp;

      runRouting();
    }

    function clearKm() {
      document.getElementById("current-km").value = "";
      runRouting();
    }

    function formatSegment(segment, side) {
      const parts = segment.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1));
      if (side === 'B') {
        return `${parts[1]} → ${parts[0]}`;
      }
      return `${parts[0]} → ${parts[1]}`;
    }

    function findRoute(start, end) {
      if (start === end) return null;
      let queue = [[start, []]];
      let visited = new Set([start]);

      while (queue.length > 0) {
        let [current, path] = queue.shift();
        if (current === end) return path;

        const neighbors = HIGHWAY_GRAPH[current] || [];
        for (let edge of neighbors) {
          if (!visited.has(edge.to)) {
            visited.add(edge.to);
            queue.push([edge.to, [...path, edge]]);
          }
        }
      }
      return null;
    }

    function getConnectorStyle(type) {
      const tp = (type || '').toUpperCase();
      if (tp.includes('CCS2')) return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/25';
      if (tp.includes('CHAD')) return 'bg-amber-500/10 text-amber-400 border-amber-500/25';
      if (tp.includes('AC')) return 'bg-sky-500/10 text-sky-400 border-sky-500/25';
      return 'bg-slate-800 text-slate-300 border-slate-700';
    }

    function getBrandDot(brand) {
      const b = (brand || '').toUpperCase();
      if (b.includes('WULING')) return 'bg-red-400';
      if (b.includes('ASTRA')) return 'bg-blue-400';
      if (b.includes('IGREEN')) return 'bg-teal-400';
      return 'bg-emerald-400';
    }

    function runRouting() {
      if (SPKLU_NETWORK.length === 0 || Object.keys(HIGHWAY_GRAPH).length === 0) return;

      const origin = document.getElementById("origin").value;
      const destination = document.getElementById("destination").value;
      const powerLimit = document.getElementById("power-filter").value;
      const search = document.getElementById("search-box").value.toLowerCase().trim();
      const currentKmVal = document.getElementById("current-km").value.trim();
      const hasCurrentKm = currentKmVal !== "" && !isNaN(parseFloat(currentKmVal));
      const curKm = hasCurrentKm ? parseFloat(currentKmVal) : null;

      const resultsContainer = document.getElementById("results-list");
      const corridorSummary = document.getElementById("corridor-summary");
      const matchCounter = document.getElementById("match-counter");

      if (origin === destination) {
        corridorSummary.innerHTML = "";
        matchCounter.textContent = `0 ${t('spots_ahead')}`;
        resultsContainer.innerHTML = `
          <div class="text-center py-12 border border-dashed border-slate-800/80 rounded-2xl bg-slate-900/10 animate-card">
            <p class="text-slate-400 text-sm">${t('err_same_city')}</p>
          </div>
        `;
        return;
      }

      const legs = findRoute(origin, destination);
      if (!legs) {
        resultsContainer.innerHTML = `
          <div class="p-6 text-center text-slate-400 border border-slate-800/80 rounded-2xl bg-slate-900/20 animate-card">
            ${t('err_no_route')}
          </div>
        `;
        return;
      }

      corridorSummary.innerHTML = legs.map((leg, idx) => `
        <span class="inline-flex items-center gap-1.5 bg-slate-900/90 border border-slate-800/90 px-2.5 py-1 rounded-md text-[11px] font-mono text-slate-300 shadow-sm transition-all hover:border-slate-700">
          <span class="text-emerald-400 font-bold">Jalur ${leg.side}</span> ${formatSegment(leg.segment, leg.side)}
        </span>
        ${idx < legs.length - 1 ? '<span class="text-slate-600 font-bold">→</span>' : ''}
      `).join("");

      let matchedStations = [];
      legs.forEach(leg => {
        let stationsOnLeg = SPKLU_NETWORK.filter(s => s.segment === leg.segment && s.side === leg.side);
        stationsOnLeg.sort((a, b) => leg.order === 'asc' ? a.km - b.km : b.km - a.km);
        stationsOnLeg.forEach(s => {
          matchedStations.push({ ...s, legOrder: leg.order });
        });
      });

      let passedCount = 0;
      if (hasCurrentKm) {
        const totalBefore = matchedStations.length;
        matchedStations = matchedStations.filter(s => {
          if (s.legOrder === 'asc') {
            return s.km >= curKm;
          } else {
            return s.km <= curKm;
          }
        });
        passedCount = totalBefore - matchedStations.length;
      }

      if (powerLimit !== "all") {
        const minKW = parseInt(powerLimit, 10);
        matchedStations = matchedStations.filter(s => s.highest_power >= minKW);
      }

      if (search) {
        matchedStations = matchedStations.filter(s => 
          s.name.toLowerCase().includes(search) || 
          `km ${s.km}`.includes(search)
        );
      }

      const ultraCount = matchedStations.filter(s => s.highest_power >= 200).length;
      let counterText = `${matchedStations.length} ${t('spots_ahead')} (${ultraCount} ${t('speed_ultra')} 200 kW)`;
      if (passedCount > 0) {
        counterText += ` • <span class="text-amber-400 font-normal">${passedCount} ${t('past_hidden')}</span>`;
      }
      matchCounter.innerHTML = counterText;

      if (matchedStations.length === 0) {
        resultsContainer.innerHTML = `
          <div class="text-center py-12 border border-slate-800/80 bg-slate-900/30 rounded-2xl animate-card">
            <p class="text-slate-400 text-sm">${t('err_no_match')}</p>
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = matchedStations.map((s, idx) => {
        let powerLabel = t('speed_fast');
        if (s.highest_power >= 200) powerLabel = t('speed_ultra');
        else if (s.highest_power >= 100) powerLabel = t('speed_rapid');

        // Dispenser modular grid
        const dispenserChips = (s.chargers || []).map(c => {
          const portsSummary = (c.ports || []).map(p => `
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-mono font-medium ${getConnectorStyle(p.type)} border">
              <span>${p.type}</span>
              <span class="font-bold">${p.power}</span>
            </span>
          `).join("");

          const plugWord = c.total_ports > 1 ? t('plugs') : t('plug');
          const sharingWord = c.shared ? t('shared_power') : t('dedicated_power');

          return `
            <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl px-3 py-2 flex flex-col sm:flex-row sm:items-center justify-between gap-2 transition-colors hover:border-slate-700/80">
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full ${getBrandDot(c.brand)}"></span>
                <span class="text-xs font-semibold text-slate-300">${c.brand}</span>
                <span class="text-[10px] text-slate-500 font-mono">(${c.total_ports} ${plugWord} • ${sharingWord})</span>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap">
                ${portsSummary}
              </div>
            </div>
          `;
        }).join("");

        const staggerDelay = Math.min(idx * 35, 300);

        return `
        <div style="animation-delay: ${staggerDelay}ms" class="animate-card group bg-slate-900/40 hover:bg-slate-900/75 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl p-4 sm:p-5 transition-all duration-300 shadow-sm hover:shadow-lg">
          
          <!-- Station Title & Power Peak -->
          <div class="flex items-start justify-between gap-4">
            <div class="space-y-1.5">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-mono text-xs font-bold px-2.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  KM ${s.km}
                </span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${s.side === 'A' ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20' : 'bg-purple-500/10 text-purple-400 border border-purple-500/20'}">
                  Jalur ${s.side}
                </span>
                <span class="text-[11px] font-medium text-slate-500">
                  ${formatSegment(s.segment, s.side)}
                </span>
              </div>
              <h3 class="font-bold text-white text-base tracking-tight group-hover:text-emerald-300 transition-colors">
                ${s.name}
              </h3>
            </div>

            <!-- Peak Power Rating -->
            <div class="text-right shrink-0">
              <div class="font-mono font-black text-xl sm:text-2xl ${s.highest_power >= 200 ? 'text-amber-400' : s.highest_power >= 100 ? 'text-emerald-400' : 'text-slate-200'}">
                ${s.lowest_power !== s.highest_power ? `${s.lowest_power}~${s.highest_power}` : s.highest_power}<span class="text-xs font-sans font-bold text-slate-400 ml-0.5">kW</span>
              </div>
              <span class="block text-[10px] uppercase font-bold tracking-wider text-slate-400">
                ${powerLabel}
              </span>
            </div>
          </div>

          <!-- Dispensers Chips -->
          <div class="mt-3.5 space-y-1.5">
            ${dispenserChips}
          </div>

          <!-- Action Links -->
          <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-xs">
            <div class="flex items-center gap-1.5">
              ${(s.types || []).map(tp => `
                <span class="text-[10px] font-bold font-mono px-2 py-0.5 rounded-md ${getConnectorStyle(tp)} border">
                  ${tp}
                </span>
              `).join("")}
            </div>

            <div class="flex items-center gap-2">
              <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener" 
                 class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700/60 active:scale-95 transition-all text-xs font-medium shadow-sm">
                <svg class="w-3.5 h-3.5 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>${t('btn_maps')}</span>
              </a>
              <a href="https://waze.com/ul?ll=${s.lat},${s.lng}&navigate=yes" target="_blank" rel="noopener" 
                 class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700/60 active:scale-95 transition-all text-xs font-medium shadow-sm">
                <svg class="w-3.5 h-3.5 text-sky-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20.5 12c0-4.69-3.81-8.5-8.5-8.5S3.5 7.31 3.5 12c0 2.21.84 4.22 2.22 5.73l-1.16 3.48c-.14.42.24.83.67.72l3.65-.91c1.37.63 2.91.98 4.54.98 4.69 0 8.5-3.81 8.5-8.5zm-11 1.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>${t('btn_waze')}</span>
              </a>
            </div>
          </div>
        </div>
      `;
      }).join("");
    }

    async function initApp() {
      const list = document.getElementById("results-list");

      try {
        const [langRes, stationsRes, graphRes, citiesRes] = await Promise.all([
          fetch("i18n.json"),
          fetch("stations.json"),
          fetch("highway.json"),
          fetch("cities.json")
        ]);

        if (!langRes.ok) throw new Error(`i18n.json error ${langRes.status}`);
        if (!stationsRes.ok) throw new Error(`stations.json error ${stationsRes.status}`);
        if (!graphRes.ok) throw new Error(`highway.json error ${graphRes.status}`);
        if (!citiesRes.ok) throw new Error(`cities.json error ${citiesRes.status}`);
        
        i18nDictionary = await langRes.json();
        SPKLU_NETWORK = await stationsRes.json();
        HIGHWAY_GRAPH = await graphRes.json();
        CITIES = await citiesRes.json();

        populateDropdowns(CITIES);
        setLang(currentLang);
        
      } catch (err) {
        console.error("Initialization Failed:", err);
        list.innerHTML = `
          <div class="p-6 text-center text-rose-400 bg-rose-950/20 border border-rose-800/40 rounded-2xl text-sm animate-card">
            Gagal memuat data SPKLU. Pastikan semua file JSON berada di folder yang sama ya.
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
