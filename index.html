  <!-- Inline CSS Kritis -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
      background-color: #070b14;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }
    
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #070b14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    html:not(.dark) body { background-color: #f8fafc; color: #0f172a; }
    html:not(.dark) #initial-loader { background-color: #f8fafc; }
    html:not(.dark) .spinner { border-color: #cbd5e1; border-top-color: #059669; }
    html:not(.dark) .loader-text { color: #475569; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e293b;
      border-top: 3px solid #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    .loader-text {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #app-content { opacity: 0; transition: opacity 0.35s ease; }
    .font-mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .drag-scroll { cursor: grab; user-select: none; }
    .drag-scroll:active { cursor: grabbing; }

    @keyframes iosCardIn { 0% { opacity: 0; transform: translateY(4px) scale(0.99); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .animate-ios-card { animation: iosCardIn 0.2s cubic-bezier(0.32, 0.72, 0, 1) both; }
    .swap-active svg { transform: rotate(180deg); }
    #results-list { min-height: 45vh; }
  </style>

  <!-- Cegah Theme Flash -->
  <script>
    const savedTheme = localStorage.getItem('theme');
    const isDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (!isDark) document.documentElement.classList.remove('dark');
  </script>
</head>

<body class="selection:bg-emerald-600 selection:text-white transition-colors duration-300 text-xs sm:text-sm">

  <!-- Loader Layar Awal -->
  <div id="initial-loader">
    <div class="spinner"></div>
    <div class="loader-text">Memuat SPKLU...</div>
  </div>

  <div id="app-content" class="min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/90 dark:bg-[#070b14]/85 backdrop-blur-xl sticky top-0 z-40 transition-colors duration-300">
      <div class="max-w-4xl mx-auto px-3 py-2 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <div class="h-6 w-6 rounded-lg bg-emerald-500/10 dark:bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-700 dark:text-emerald-400 font-bold text-xs">
            ⚡
          </div>
          <h1 data-i18n="title" class="font-extrabold text-slate-900 dark:text-white text-sm tracking-tight m-0">SPKLU Trans Jawa</h1>
        </div>
        
        <div class="flex items-center gap-1">
          <!-- Install PWA -->
          <button type="button" id="btn-install" class="hidden items-center gap-1 px-2.5 h-7 text-[11px] font-bold rounded-lg bg-emerald-700 hover:bg-emerald-600 text-white shadow-sm transition-all active:scale-95">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 111.414-1.414L9 10.586V3a1 1 0 011-1zM3 14a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"/></svg>
            <span>Install</span>

            <svg id="theme-icon-dark" class="w-3.5 h-3.5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">

            </svg>
            <svg id="theme-icon-light" class="w-3.5 h-3.5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>

          <!-- Language Switcher -->
          <div class="flex items-center bg-slate-200 dark:bg-slate-800 rounded-lg p-0.5 border border-slate-300 dark:border-slate-700 h-7">
            <button onclick="setLang('id')" id="btn-id" class="px-2 h-6 text-[10px] font-bold rounded transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm">ID</button>
            <button onclick="setLang('en')" id="btn-en" class="px-2 h-6 text-[10px] font-bold rounded transition-all text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-2.5 sm:px-3 py-2 w-full flex-grow">
      
      <!-- Planner Rute Compact -->
      <section aria-label="Filter dan Rute" class="relative z-30 bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 rounded-xl p-2 sm:p-2.5 shadow-sm dark:shadow-xl backdrop-blur-xl mb-2 transition-all">
        
        <!-- Box Asal & Tujuan -->

            <span class="w-1.5 h-1.5 rounded-full border border-emerald-600 dark:border-emerald-500 bg-emerald-100 dark:bg-emerald-950"></span>
            <span class="w-0.5 flex-1 my-0.5 bg-slate-300 dark:bg-slate-700"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
          </div>

          <div class="flex-1 min-w-0 flex flex-col pr-1">
            <!-- Asal -->
            <div class="relative" id="dropdown-origin-wrapper">
              <button type="button" id="origin-trigger" onclick="toggleDropdown('origin')" aria-haspopup="listbox" class="w-full flex items-center justify-between text-left py-0.5 text-slate-900 dark:text-white text-xs sm:text-sm font-bold focus:outline-none rounded px-1 group">
                <span id="origin-label" class="truncate">Jakarta</span>
                <svg class="h-3 w-3 text-slate-400 group-hover:text-emerald-600 transition-transform duration-200" id="origin-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              <!-- Dropdown Menu Lebih Panjang (max-h-72 s/d max-h-80) -->
              <div id="origin-menu" class="hidden absolute left-0 top-full mt-1 w-64 max-h-72 sm:max-h-80 overflow-y-auto no-scrollbar z-50 bg-white/95 dark:bg-slate-900/95 border border-slate-300 dark:border-slate-700 rounded-xl shadow-2xl backdrop-blur-xl p-1.5 animate-ios-card" role="listbox">
                <div class="sticky top-0 bg-white/95 dark:bg-slate-900/95 pb-1 mb-1 border-b border-slate-200 dark:border-slate-800 z-10">
                  <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg px-2 py-1 focus-within:ring-1 focus-within:ring-emerald-500">
                    <input type="text" id="origin-search" oninput="filterCities('origin')" aria-label="Cari kota asal" placeholder="Cari kota..." autocomplete="off" class="w-full bg-transparent text-slate-900 dark:text-white text-xs focus:outline-none placeholder-slate-400">
                  </div>
                </div>
                <div id="origin-list" class="space-y-0.5"></div>
              </div>
              <input type="hidden" id="origin" value="jakarta">
            </div>

            <div class="h-px bg-slate-200 dark:bg-slate-800 w-full my-0.5"></div>

            <!-- Tujuan -->
            <div class="relative" id="dropdown-destination-wrapper">
              <button type="button" id="destination-trigger" onclick="toggleDropdown('destination')" aria-haspopup="listbox" class="w-full flex items-center justify-between text-left py-0.5 text-slate-900 dark:text-white text-xs sm:text-sm font-bold focus:outline-none rounded px-1 group">
                <span id="destination-label" class="truncate">Surabaya</span>
                <svg class="h-3 w-3 text-slate-400 group-hover:text-emerald-600 transition-transform duration-200" id="destination-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
              <!-- Dropdown Menu Lebih Panjang (max-h-72 s/d max-h-80) -->
              <div id="destination-menu" class="hidden absolute left-0 top-full mt-1 w-64 max-h-72 sm:max-h-80 overflow-y-auto no-scrollbar z-50 bg-white/95 dark:bg-slate-900/95 border border-slate-300 dark:border-slate-700 rounded-xl shadow-2xl backdrop-blur-xl p-1.5 animate-ios-card" role="listbox">
                <div class="sticky top-0 bg-white/95 dark:bg-slate-900/95 pb-1 mb-1 border-b border-slate-200 dark:border-slate-800 z-10">
                  <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-lg px-2 py-1 focus-within:ring-1 focus-within:ring-emerald-500">
                    <input type="text" id="destination-search" oninput="filterCities('destination')" aria-label="Cari kota tujuan" placeholder="Cari kota..." autocomplete="off" class="w-full bg-transparent text-slate-900 dark:text-white text-xs focus:outline-none placeholder-slate-400">
                  </div>
                </div>
                <div id="destination-list" class="space-y-0.5"></div>
              </div>
              <input type="hidden" id="destination" value="surabaya">
            </div>
          </div>

          <!-- Swap Button -->
          <div class="shrink-0 pl-1">
            <button type="button" id="btn-swap" onclick="swapLocations()" aria-label="Tukar rute" title="Tukar rute" class="h-7 w-7 rounded-lg bg-white hover:bg-emerald-600 hover:text-white dark:bg-slate-800 dark:hover:bg-emerald-600 dark:hover:text-white text-slate-600 dark:text-emerald-400 border border-slate-200 dark:border-slate-700 transition-all flex items-center justify-center shadow-sm active:scale-90">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" /></svg>
            </button>
          </div>
        </div>

        <!-- Ruas Tol (Tinggi Seragam h-7) -->
        <div class="mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800/80">
          <div id="corridor-summary" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 -mx-1 px-1 drag-scroll"></div>
        </div>

        <!-- Filter Controls -->
        <div class="mt-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800/80 space-y-1.5">
          
          <!-- Baris Filter 1: Colokan & Kecepatan (Tinggi h-7) -->
          <div class="flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            <div class="flex items-center gap-0.5 bg-slate-100 dark:bg-slate-900 p-0.5 border border-slate-200 dark:border-slate-800 rounded-lg shrink-0">
              <button type="button" onclick="toggleConnector('CCS2')" id="btn-conn-ccs2" aria-pressed="true" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all bg-emerald-600 text-white shadow-sm dark:bg-emerald-600 active:scale-95">CCS2</button>
              <button type="button" onclick="toggleConnector('Chademo')" id="btn-conn-chademo" aria-pressed="true" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all bg-emerald-600 text-white shadow-sm dark:bg-emerald-600 active:scale-95">Chademo</button>
              <button type="button" onclick="toggleConnector('AC')" id="btn-conn-ac" aria-pressed="true" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all bg-emerald-600 text-white shadow-sm dark:bg-emerald-600 active:scale-95">AC</button>
            </div>

            <div class="flex items-center gap-0.5 bg-slate-100 dark:bg-slate-900 p-0.5 border border-slate-200 dark:border-slate-800 rounded-lg shrink-0">
              <button type="button" onclick="setSpeedFilter('all')" id="btn-speed-all" aria-pressed="true" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm" data-i18n="speed_all">Semua</button>
              <button type="button" onclick="setSpeedFilter('50')" id="btn-speed-50" aria-pressed="false" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all text-slate-600 dark:text-slate-300">≥50k</button>
              <button type="button" onclick="setSpeedFilter('100')" id="btn-speed-100" aria-pressed="false" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all text-slate-600 dark:text-slate-300">≥100k</button>
              <button type="button" onclick="setSpeedFilter('200')" id="btn-speed-200" aria-pressed="false" class="h-6 px-1.5 rounded text-[11px] font-bold transition-all text-slate-600 dark:text-slate-300">200k</button>
            </div>
          </div>

          <!-- Baris Filter 2: Input KM, Baterai, & Toggle Jangkauan (Tinggi Tepat h-8) -->
          <div class="flex items-center gap-1.5">
            
            <!-- Box KM (h-8 seragam, placeholder compact) -->
            <div class="flex-1 min-w-0 h-8 flex items-center bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-1.5 focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all">
              <label for="current-km" class="sr-only">KM Sekarang</label>
              <span class="text-[10px] font-bold font-mono text-emerald-700 dark:text-emerald-400 mr-1 shrink-0">KM</span>
              <input type="number" id="current-km" oninput="animatedRouting(false)" placeholder="Posisi" class="w-full min-w-0 bg-transparent text-slate-900 dark:text-white placeholder-slate-400 text-xs font-mono focus:outline-none p-0">
              
              <!-- Tombol GPS -->
              <button type="button" id="btn-detect-km" onclick="detectCurrentKm()" title="Deteksi GPS" aria-label="Deteksi GPS" class="w-5 h-5 shrink-0 flex items-center justify-center text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
                <svg id="icon-gps" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v3m0 14v3m10-10h-3M5 12H2m14.071-7.071l-2.121 2.121M8.05 15.95l-2.121 2.121m12.02 0l-2.121-2.121M8.05 8.05L5.929 5.929M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg id="icon-gps-loading" class="hidden h-3 w-3 animate-spin text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
              </button>

              <!-- Tombol Clear -->
              <button type="button" onclick="clearKm()" aria-label="Hapus KM" class="w-4 h-4 shrink-0 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>

            <!-- Box Baterai (h-8 seragam, placeholder compact) -->
            <div class="flex-1 min-w-0 h-8 flex items-center bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-1.5 focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all">
              <label for="battery-range" class="sr-only">Jangkauan Baterai (km)</label>
              <span class="text-xs mr-1 shrink-0" aria-hidden="true">🔋</span>

              <input type="checkbox" id="filter-within-range" onchange="animatedRouting(false)" class="rounded border-slate-400 dark:border-slate-600 text-emerald-600 focus:ring-emerald-500 cursor-pointer w-3.5 h-3.5">
              <span class="hidden sm:inline" data-i18n="within_range_only">Dalam jangkauan</span>

        </div>

      <!-- Status Bar -->
      <div id="stats-banner" class="flex items-center justify-between px-1 mb-2 text-xs text-slate-600 dark:text-slate-400 font-semibold" aria-live="polite">

        <span data-i18n="sort_info" class="text-slate-500 dark:text-slate-500 text-[10px] hidden sm:block">Urut sesuai arah jalanmu</span>

      <section aria-label="Daftar SPKLU" id="results-list" class="relative z-0 space-y-2">
        <div class="p-5 text-center text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-800/60 rounded-xl bg-white dark:bg-slate-900/20 shadow-sm" data-i18n="loading">
          Mengecek tempat cas di sepanjang jalurmu...
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-300 dark:border-slate-800/80 bg-white/50 dark:bg-transparent py-3 text-center text-xs text-slate-600 dark:text-slate-400 space-y-1.5 mt-3">
