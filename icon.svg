<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradien Latar Belakang -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Pendaran Cahaya Hijau Emerald -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Gradien Kilatan Petir -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Latar Squircle Sudut Halus -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Bingkai Tipis Elegan -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="3" />

  <!-- Lingkaran Cahaya Pusat -->
  <circle cx="256" cy="256" r="185" fill="url(#glowGrad)" />

  <!-- Siluet Jalan Tol Trans Jawa Menuju Horizon -->
  <path d="M144 442 L228 295 L284 295 L368 442 Z" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="2" />
  <line x1="256" y1="382" x2="256" y2="432" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85" />
  <line x1="256" y1="312" x2="256" y2="352" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Ikon Petir Listrik Utama -->
  <polygon points="274,80 180,246 250,246 226,410 344,216 268,216" fill="url(#boltGrad)" />

  <!-- Pantulan Cahaya Inti -->
  <polygon points="274,106 200,240 252,240 236,368 324,224 274,224" fill="#a7f3d0" fill-opacity="0.45" />
</svg>